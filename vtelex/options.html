<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vtelex shortcuts</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { margin: 16px; min-width: 420px; }
  p { margin: 0 0 8px; opacity: 0.8; }
  textarea { box-sizing: border-box; width: 100%; height: 360px; font: 13px ui-monospace, monospace; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  #status { opacity: 0.8; }
</style>
</head>
<body>
<p>One <code>shortcut = text</code> per line. In VI mode, a shortcut followed by Space, Enter or punctuation becomes its text, following the case you typed (Ko → Không, KO → KHÔNG).</p>
<textarea id="macros" spellcheck="false"></textarea>
<div class="row">
  <button id="save">Save</button>
  <button id="reset">Reset to defaults</button>
  <span id="status"></span>
</div>
<script src="macros.js"></script>
<script src="options.js"></script>
</body>
</html>
