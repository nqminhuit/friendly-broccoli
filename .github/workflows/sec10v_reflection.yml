# One manual dispatch turns a Standard Ebooks chapter URL into a ~10-minute *reflection* video
# (not a word-for-word reading), waiting on the channel as a private upload:
#
#   prepare_reflection.py reads your script (<BaseName>.script.md) from the bucket → Gemini writes
#   one image prompt per section and the SEO, unless you uploaded them too → THE PROMPTS ARE
#   PRINTED IN THE LOG of the "🚨 IMAGE PROMPTS READY" step and the script in the
#   "📝 Reflection script" step → trigger_workflow.py fans out one sec10v.yml run
#   per chunk + 1 intro run → reflection_images.py waits for <IMAGE_BASE_URL>/<BaseName>.<k>.jpg
#   → import_artifacts_mp3s.py collects the audio → automate_audiobook.py builds the video,
#   crossfading into each section's image → reflection_chapters.py adds YouTube chapters →
#   youtube_upload.py publishes it as private.
#
# The voice input picks the narrator; every chunk run is dispatched with it. Its default is
# deliberately not the audiobook's voice.
#
# Human steps: upload the script to the bucket as <BaseName>.script.md, then dispatch. Copy each
# image prompt out of the 🚨 step's log, draw the images, and upload them as <BaseName>.1.jpg …
# <BaseName>.<n>.jpg while the TTS runs (or upload them before dispatching). A missing image
# falls back to the previous section's; without image 1 no video is built. To change the
# script, edit <BaseName>.script.md in the bucket and re-dispatch — uploaded images are reused.
#
# Every run saves the prompts and SEO Gemini wrote to the bucket; an uploaded <BaseName>.seo.md or
# <BaseName>.<k>.prompt.txt replaces Gemini's for that file, and the next run reuses them — so after
# changing what a section is about (or the number of sections), delete them so Gemini writes new ones.
# YouTube upload is temporarily off (UPLOAD_TO_YOUTUBE); the video goes to the bucket as <BaseName>.<voice>.mp4.
#
# Secrets — those of sec10v_chapter.yml (see there for details), plus the four BUCKET_* ones:
#   IMAGE_BASE_URL        image bucket prefix, no trailing slash; also where the script is read from (required)
#   BUCKET_S3_ENDPOINT    S3 API endpoint of the bucket (MinIO or other S3-compatible), e.g. https://minio.example.com
#   BUCKET_S3_URI         s3://<bucket>/<prefix>, the same folder IMAGE_BASE_URL serves
#   BUCKET_ACCESS_KEY_ID  S3 access key with write access to that folder
#   BUCKET_SECRET_ACCESS_KEY  its secret key
#   SEC10V_ACCESS_TOKEN   also used by sec10v.yml
#   YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN
#   GEMINI_API_KEY        writes the image prompts and the SEO
#   HF_TOKEN
name: sec10v reflection
run-name: ${{ inputs.se_url }}

on:
  workflow_dispatch:
    inputs:
      se_url:
        description: 'Chapter URL copied from GitHub (…/<owner>/<repo>/blob/<ref>/src/epub/text/<chapter>.xhtml). Any owner and ref: a fork with edited text works, and the branch you name is the branch that is read. Add #<section-id> to narrate one chapter of a file that holds several, e.g. …/part-1.xhtml#chapter-1-1.'
        required: true
        type: string
      sec10v_ref:
        description: 'nqminhuit/sec10v ref to check out'
        required: false
        type: string
        default: 'master'
      voice:
        description: 'Narrator voice (sec10v resources/voices/); the audiobook uses a different default'
        required: false
        type: choice
        default: '_live/maddpren_enhanced_cut_magician_12_maugham_128kb.wav'
        options:
          - '_live/maddpren_enhanced_cut_magician_12_maugham_128kb.wav'
          - '_live/maddpren_enhance_cut_magician_12_maugham_128kb.mp3'
          - '_live/DianeAlailima_bedtimestories_36_anonymous_128kb.cleaned.mp3'
          - '_live/DianeAlailima_cut_wondergarden_122_olcott_128kb.mp3'
          - '_live/DianeAlailima_wondergarden_121_olcott_128kb.cleaned.mp3'
          - '_live/DianeAlailima_wondergarden_122_olcott_128kb.cleaned.mp3'
          - '_live/HannahC_cut_girlsofstcyprians_09_brazil_128kb.mp3'
          - '_live/LesWilLang_cut_ladyofthearoostook_02_howells_128kb.mp3'
          - '_live/Rapunzelina_cut_essaysonart_34_goethe_128kb.mp3'
          - '_live/TriciaG_cut_bobbyswolf_31_pansy_128kb.mp3'
          - '_live/TriciaG_cut_ssc115_02_various_128kb.mp3'
          - '_live/thestorygirl_clean9s.mp3'
          - '_live/thestorygirl_cut_cm2_02_mason_128kb.mp3'

env:
  UPLOAD_TO_YOUTUBE: 'false'    # temporarily off while comparing voices; set to 'true' to publish to YouTube again
  MAX_CHUNKS: '20'
  # Writes the image prompts and SEO; stronger than the audiobook's flash-lite.
  # List models: curl -H "x-goog-api-key: …" https://generativelanguage.googleapis.com/v1beta/models
  REFLECTION_MODEL: 'gemini-3.8-flash'
  # Tried in order after REFLECTION_MODEL; each but the last gets one try and moves on after any failure.
  # The last one retries 429, 5xx and timeouts; Gemma is last because it has its own rate limits.
  # The 2.5 models are left out because Google limits them to earlier users.
  GEMINI_FALLBACK_MODELS: 'gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemma-4-26b-a4b-it'
  # The human drawing up to 5 images is the critical path, hence the long second window.
  IMAGE_EARLY_WAIT_MINUTES: '20'  # while the chunk runs are synthesizing
  IMAGE_WAIT_MINUTES: '120'       # second chance, after the audio is collected
  VIDEO_FRAMERATE: '25'           # a smooth crossfade needs more than the audiobook's 5 fps
  CROSSFADE_SECONDS: '1'          # fade into each new section's image

permissions:
  actions: write        # dispatch sec10v.yml runs in this repo and read their artifacts
  contents: read

jobs:
  reflection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Never prints IMAGE_BASE_URL: it is a secret, and only the filenames are needed.
      - name: Show workflow inputs
        if: always()
        env:
          SE_URL: ${{ inputs.se_url }}
          SEC10V_REF: ${{ inputs.sec10v_ref }}
          VOICE: ${{ inputs.voice }}
        run: |
          {
            echo "### Workflow Inputs"
            echo "- Chapter URL: \`$SE_URL\`"
            echo "- sec10v ref: \`$SEC10V_REF\`"
            echo "- Voice: \`$VOICE\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Chapter URL: $SE_URL"
          echo "sec10v ref: $SEC10V_REF"
          echo "Voice: $VOICE"

      - name: Checkout nqminhuit/sec10v
        uses: actions/checkout@v7
        with:
          repository: nqminhuit/sec10v
          path: sec10v
          ref: ${{ inputs.sec10v_ref }}
          token: ${{ secrets.SEC10V_ACCESS_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The main runner never runs TTS itself; requests is all the sec10v scripts here import.
      # (automate_audiobook.py is stdlib-only and skips TTS entirely when the MP3s exist.)
      - name: Install Python dependencies
        run: pip install requests

      - name: Prepare the reflection from your script (image prompts and SEO)
        timeout-minutes: 90   # safety net only; gemini_client.py enforces its own retry budgets
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          SE_URL: ${{ inputs.se_url }}   # via env, never spliced into the script body
          VOICE: ${{ inputs.voice }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$IMAGE_BASE_URL" ]; then
            echo "❌ the IMAGE_BASE_URL secret is not set — your script is read from the image bucket"
            exit 1
          fi
          args=(--url "$SE_URL" --max-chunks "$MAX_CHUNKS" --script-base-url "$IMAGE_BASE_URL")
          if [ -n "$VOICE" ]; then args+=(--voice "$VOICE"); fi
          python scripts/prepare_reflection.py "${args[@]}"
          # Export the parsed/inferred values for the later steps.
          python - <<'EOF' >> "$GITHUB_ENV"
          import json
          d = json.load(open("out/chapter.json"))
          for env, key in (("BASE", "base_name"), ("BOOK_TITLE", "book_title"),
                           ("CHAPTER_TITLE", "chapter_title"),
                           ("AUTHOR", "author")):
              assert "\n" not in d[key]
              print(f"{env}={d[key]}")
          EOF
          echo "--- out/text ---"; ls -la out/text
          echo "--- dispatch manifest ---"; python -c "import json; print(len(json.load(open('out/workflow-input.json'))), 'item(s)')"

      # Only what Gemini wrote this run (never the script), so bucket edits survive; the SEO goes up
      # before the chapters block is added. aws's stderr is swallowed: it would show the bucket and prefix.
      - name: Save Gemini's outputs to the bucket
        continue-on-error: true
        working-directory: sec10v
        env:
          BUCKET_S3_ENDPOINT: ${{ secrets.BUCKET_S3_ENDPOINT }}
          BUCKET_S3_URI: ${{ secrets.BUCKET_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1   # MinIO accepts any region unless one is configured
        run: |
          if [ -z "$BUCKET_S3_ENDPOINT" ] || [ -z "$BUCKET_S3_URI" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "⏭️ bucket upload secrets not set (BUCKET_S3_ENDPOINT, BUCKET_S3_URI, BUCKET_ACCESS_KEY_ID, BUCKET_SECRET_ACCESS_KEY) — Gemini's outputs are not saved"
            exit 0
          fi
          aws --version
          aws configure set default.s3.addressing_style path   # MinIO needs path-style
          # One "<local file>\t<bucket name>" line per file Gemini wrote this run.
          uploads=$(python - <<'EOF'
          import json
          import os

          d = json.load(open("out/chapter.json"))
          base = d["base_name"]
          if "generated_files" in d:
              for name in d["generated_files"]:
                  if "/" in name or name.endswith(".script.md"):
                      continue
                  dirs = ("out/seo", "out/prompts")
                  file = next((f"{p}/{name}" for p in dirs if os.path.exists(f"{p}/{name}")), f"{dirs[1]}/{name}")
                  print(f"{file}\t{name}")
          else:
              # An older sec10v's chapter.json has no generated_files.
              models = d.get("models", {})
              if models.get("script") != "edited":
                  print(f"out/{base}.script.md\t{base}.script.md")
              if models.get("prompts") != "bucket":
                  print(f"out/seo/{base}.seo.md\t{base}.seo.md")
                  for k in range(1, len(d["sections"]) + 1):
                      print(f"out/prompts/{base}.{k}.prompt.txt\t{base}.{k}.prompt.txt")
          EOF
          )
          if [ -z "$uploads" ]; then
            echo "nothing new to save — everything came from the bucket"
            exit 0
          fi
          failed=0
          while IFS=$'\t' read -r file name; do
            if [ "${name##*.}" = "md" ]; then type="text/markdown; charset=utf-8"; else type="text/plain; charset=utf-8"; fi
            # </dev/null so aws can never swallow the rest of the list from stdin.
            if [ -f "$file" ] && err=$(aws s3 cp --endpoint-url "$BUCKET_S3_ENDPOINT" --only-show-errors \
                --content-type "$type" "$file" "${BUCKET_S3_URI%/}/${name}" 2>&1 </dev/null); then
              echo "✅ saved ${name}"
            else
              code=$(printf '%s' "${err:-}" | grep -o 'An error occurred ([A-Za-z]*)' | head -n1 || true)
              echo "❌ could not save ${name}${code:+ — $code}"
              failed=1
            fi
          done <<< "$uploads"
          if [ "$failed" -ne 0 ]; then exit 1; fi

      # YouTube takes an untimed transcript and aligns it to the audio itself, so this is just
      # the intro plus the chapter text — the exact words the TTS read. Written here, right after
      # the text exists, so it survives a failure anywhere later in the run.
      - name: Write the YouTube transcript
        working-directory: sec10v
        run: |
          echo "::group::transcript"
          python scripts/transcript.py
          echo "::endgroup::"

      # No "Reuse audio from a previous run" step: per-chunk audio is matched by filename only, so
      # a re-run's new script would be paired with the old audio. ~10 chunks are cheap to redo.

      # Single pass, so the prompt step below can mark images already in the bucket.
      - name: Pick up images already uploaded
        continue-on-error: true
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: |
          if [ -z "$IMAGE_BASE_URL" ]; then
            echo "⏭️ no IMAGE_BASE_URL secret — skipping the image check"
            exit 0
          fi
          set +e
          python scripts/reflection_images.py --base-url "$IMAGE_BASE_URL" --timeout 0 --poll-interval 20
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 10 ]; then exit "$rc"; fi

      # The log, not $GITHUB_STEP_SUMMARY: the summary page is kept to the QA table and the
      # transcript, so the prompts are printed here, first and uncollapsed (no ::group::), because
      # they are the one time-critical thing on the page; the script gets its own step below.
      # `if: always()` so a late failure still shows whatever was written. Every conditional here
      # is if/fi, never `[ … ] && …`: under `bash -e` a trailing false test would fail the step,
      # and a failed always()-step marks the whole job failed.
      - name: "🚨 IMAGE PROMPTS READY — copy from this step"
        if: always()
        working-directory: sec10v
        env:
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: |
          if [ -z "$BASE" ] || [ ! -f out/chapter.json ]; then
            echo 'no image prompts — the prepare step failed; see its log for the errors'
            exit 0
          fi
          # IMAGE_BASE_URL is a secret, so anything echoing it shows as ***; the filename is
          # the part you actually need, and it is not sensitive.
          if [ -n "$IMAGE_BASE_URL" ]; then target="your image bucket"; else target="your image bucket (set the IMAGE_BASE_URL secret)"; fi
          TARGET="$target" python - <<'EOF'
          import json
          import os

          sections = json.load(open("out/chapter.json"))["sections"]
          n = len(sections)
          for k, section in enumerate(sections, 1):
              image = section["image"]
              print(f"=== image {k} of {n} — {section['heading']} ===")
              prompt = f"out/prompts/{image}.prompt.txt"
              if os.path.exists(prompt):
                  print(open(prompt).read().rstrip())
              else:
                  print(f"(no {prompt})")
              if os.path.exists(f"out/pics/{image}.jpg"):
                  print("✅ already uploaded")
              else:
                  print(f"upload to {os.environ['TARGET']} as {image}.jpg (.png, .jpeg and .webp work too)")
              print()
          EOF
          echo "Polling starts as soon as the chunk runs are dispatched and lasts ${IMAGE_EARLY_WAIT_MINUTES} minute(s)."
          echo "A second window of ${IMAGE_WAIT_MINUTES} minute(s) follows once the audio is collected."

      # Separate from the prompts so they are not buried under ~1,500 words of script.
      - name: "📝 Reflection script — review it here"
        if: always()
        working-directory: sec10v
        run: |
          if [ -z "$BASE" ] || [ ! -f out/chapter.json ]; then
            echo "no script — the prepare step failed; see its log for the errors"
            exit 0
          fi
          echo "=== script — ${BOOK_TITLE} / ${CHAPTER_TITLE} ==="
          if [ -s "out/${BASE}.script.md" ]; then
            cat "out/${BASE}.script.md"; echo
          else
            echo "(no out/${BASE}.script.md)"
          fi
          echo
          echo "To change it, edit ${BASE}.script.md in the bucket and re-run."
          echo "If you change what a section is about (or the number of sections), delete the saved"
          echo "${BASE}.seo.md and ${BASE}.<k>.prompt.txt from the bucket too, so Gemini writes new ones."

      # Needed by the video build at the end (and it is cheap here, while the human is drawing).
      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n1
            exit 0
          fi
          # Must be a full apt-get update: Ubuntu 24.04 keeps its repositories in
          # /etc/apt/sources.list.d/ubuntu.sources (deb822), so a narrowed update refreshes no
          # index at all and apt resolves package versions from the image's stale one — those 404
          # once the mirror moves on (e.g. libssh-gcrypt-4 0.10.6-2ubuntu0.4).
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg \
            || sudo apt-get install -y --no-install-recommends --fix-missing ffmpeg
          ffmpeg -version | head -n1

      # One hub download per chapter instead of one per chunk: the chunk runs restore this
      # same cache key and then run with HF_HUB_OFFLINE=1. Without it they all hit Hugging
      # Face at the same moment and got HTTP 429. The key must stay identical to the one in
      # sec10v.yml — both hash the requirements file that pins chatterbox-tts.
      - name: Restore the Chatterbox weights cache
        id: hf_cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-chatterbox-${{ hashFiles('sec10v/requirements_no_cuda.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-chatterbox-

      - name: Warm the Chatterbox weights cache
        if: steps.hf_cache.outputs.cache-hit != 'true'
        working-directory: sec10v
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Two separate installs on purpose: --no-deps applies to every package in a pip
          # command, so installing both together left huggingface_hub without httpx and the
          # fetch died with ModuleNotFoundError. huggingface_hub needs its dependencies;
          # chatterbox-tts is code-only here, just so hf_weights.py can read the weight list
          # out of the version this chapter will actually run with.
          pip install --quiet huggingface_hub
          pin=$(grep -m1 '^chatterbox-tts==' requirements_no_cuda.txt)
          pip install --quiet --no-deps "${pin:-chatterbox-tts}"
          python scripts/hf_weights.py --no-stagger
          du -sh ~/.cache/huggingface

      - name: Save the Chatterbox weights cache
        if: steps.hf_cache.outputs.cache-hit != 'true'
        continue-on-error: true   # a concurrent run may have reserved the same key already
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-chatterbox-${{ hashFiles('sec10v/requirements_no_cuda.txt') }}

      # Dispatch → wait → re-dispatch only what is missing. A chunk run can die on its own
      # (hub rate limit, flaky mirror, the QA retry giving up), and the runner has no
      # persistent out/ to resume from, so pending_chunks.py rebuilds the manifest from the
      # audio that actually landed: exit 0 = complete, 10 = it rewrote the manifest with the
      # stragglers, anything else = broken. A chunk that hasn't finished in 40 minutes never
      # will — re-dispatching it next round is faster than waiting, and 3 x 40 leaves room in
      # the job budget for the image wait and the encode.
      # trigger_workflow.py returns as soon as the runs are dispatched, so the chunks synthesize
      # on their own runners from here on. Round 1 is dispatched in its own step purely so the
      # image wait below can slot in between dispatch and collection.
      - name: Dispatch one sec10v.yml run per chunk (+ intro)
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/trigger_workflow.py \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --workflow sec10v.yml \
            --ref master \
            --inputs-file out/workflow-input.json \
            --token "${{ secrets.GITHUB_TOKEN }}"

      # Costs nothing: without it the job would spend these minutes idle inside the collector's
      # poll. The log streams live, so a wrong filename or a corrupt upload shows up now.
      - name: Wait for the section images (while the chunks synthesize)
        id: image
        continue-on-error: true
        timeout-minutes: 60   # safety net only; reflection_images.py enforces its own deadline
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: |
          if [ -z "$IMAGE_BASE_URL" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ no IMAGE_BASE_URL secret — skipping the image wait"
            exit 0
          fi
          wait_minutes=${IMAGE_EARLY_WAIT_MINUTES%%.*}
          args=(--base-url "$IMAGE_BASE_URL" --timeout "$((${wait_minutes:-0} * 60))" --poll-interval 20)
          set +e
          python scripts/reflection_images.py "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then complete=true; else complete=false; fi
          if [ -f "out/pics/${BASE}.jpg" ]; then found=true; else found=false; fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$complete" = "true" ]; then
            echo "✅ every section image received — the video will build as soon as the audio lands"
          else
            echo "⏳ image(s) still missing (exit $rc) — there is a second window after the audio is collected"
          fi

      - name: Collect MP3s, retry stragglers
        working-directory: sec10v
        timeout-minutes: 200   # bounds the polling loop below; the job cap is 330
        env:
          PYTHONPATH: scripts
        run: |
          rounds=3
          for round in $(seq 1 "$rounds"); do
            if [ "$round" -gt 1 ]; then
              echo "::group::round $round — re-dispatch the missing chunk(s)"
              # trigger_workflow.py rewrites out/run_ids.json, so each round polls only its own runs.
              python scripts/trigger_workflow.py \
                --owner "${{ github.repository_owner }}" \
                --repo "${{ github.event.repository.name }}" \
                --workflow sec10v.yml \
                --ref master \
                --inputs-file out/workflow-input.json \
                --token "${{ secrets.GITHUB_TOKEN }}"
              echo "::endgroup::"
            fi

            # Round 1 dispatches 30+ runs, which queue behind GitHub's concurrency limit, so a
            # chunk can legitimately take ~45 min end to end. Later rounds have the runners to
            # themselves.
            if [ "$round" -eq 1 ]; then collect_timeout=5400; else collect_timeout=2700; fi

            while :; do
              echo "::group::round $round — wait and collect"
              python scripts/import_artifacts_mp3s.py \
                --download --move \
                --poll-interval 60 --timeout "$collect_timeout" \
                --token "${{ secrets.GITHUB_TOKEN }}"
              echo "::endgroup::"

              set +e
              python scripts/pending_chunks.py --rewrite
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                echo "✅ every chunk present after round $round"
                break 2
              fi
              if [ "$rc" -ne 10 ]; then exit "$rc"; fi

              # Audio is missing — but only re-dispatch runs that have actually finished.
              # Re-dispatching one that is merely slow duplicates ~40 minutes of TTS and makes
              # the wait *longer*: chunk 27 once ran 04:26-05:12 while the loop gave up at
              # 05:06 and started a copy at 05:08.
              if python scripts/runs_alive.py --token "${{ secrets.GITHUB_TOKEN }}"; then
                echo "⏳ chunk run(s) still in flight — polling again instead of re-dispatching"
                continue
              fi
              break
            done

            if [ "$round" -eq "$rounds" ]; then
              echo "❌ still missing chunk(s) after $rounds round(s)"
              exit 1
            fi
            echo "🔁 round $((round + 1)) will re-dispatch only the missing chunk(s)"
          done
          echo "--- out/*.mp3 ---"; ls -la out/*.mp3

      # Second chance, for images not up yet during the synthesis window.
      - name: Wait for the section images (second chance)
        id: image_retry
        if: steps.image.outputs.complete != 'true'
        continue-on-error: true
        timeout-minutes: 180   # safety net only: reflection_images.py enforces --timeout itself
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: |
          if [ -z "$IMAGE_BASE_URL" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ no IMAGE_BASE_URL secret — skipping the video"
            exit 0
          fi
          wait_minutes=${IMAGE_WAIT_MINUTES%%.*}
          args=(--base-url "$IMAGE_BASE_URL" --timeout "$((${wait_minutes:-0} * 60))" --poll-interval 20)
          set +e
          python scripts/reflection_images.py "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then complete=true; else complete=false; fi
          if [ -f "out/pics/${BASE}.jpg" ]; then found=true; else found=false; fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ -d out/pics ]; then ls -la out/pics; fi
          if [ "$found" != "true" ]; then
            echo "⚠️ image 1 never arrived (exit $rc) — no video will be built"
          fi

      - name: Build the final video
        id: video
        if: steps.image.outputs.found == 'true' || steps.image_retry.outputs.found == 'true'
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          PYTHONUNBUFFERED: '1'   # so the per-segment progress lines stream instead of arriving at the end
        run: |
          # Preflight: every mp3 must exist, or automate_audiobook would shell out to audiobook.py
          # and fail on the torch this runner deliberately doesn't have.
          python scripts/pending_chunks.py
          python scripts/automate_audiobook.py "$BASE" --segment-images out/segment-images.json \
            --framerate "$VIDEO_FRAMERATE" --crossfade "$CROSSFADE_SECONDS"
          ls -lh out/*.final.mp4

      # whisper-cli for the spot-check below. Restore only, never build: the chunk runs populate
      # this exact cache key, and a QA nicety is not worth a 10-minute compile on a miss —
      # verify_final.py just reports the spot-check as skipped when the binary isn't there.
      - name: Check out whisper.cpp for the final QA
        if: steps.video.outcome == 'success'
        uses: actions/checkout@v7
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: master
          fetch-depth: 1

      - name: Get whisper.cpp HEAD SHA
        id: whisper-sha
        if: steps.video.outcome == 'success'
        run: echo "sha=$(git -C whisper.cpp rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Restore the whisper.cpp build
        if: steps.video.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: |
            whisper.cpp/build
            whisper.cpp/models/ggml-small.en.bin
          key: ${{ runner.os }}-whisper-cpp-${{ steps.whisper-sha.outputs.sha }}-cpu-compat

      # What the per-chunk QA structurally cannot see: a missing, duplicated, misordered or
      # truncated segment. Duration arithmetic catches the first three for the price of an
      # ffprobe; three sampled 30s windows located in the transcript catch the rest. A full
      # transcription would cost 20-30 min of runner time to re-check text the chunk runs
      # already verified.
      - name: Verify the final video
        id: qa
        if: steps.video.outcome == 'success'
        continue-on-error: true
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/verify_final.py \
            --whisper-cli "${{ github.workspace }}/whisper.cpp/build/bin/whisper-cli" \
            --model "${{ github.workspace }}/whisper.cpp/models/ggml-small.en.bin" \
            --summary "$GITHUB_STEP_SUMMARY"

      # Non-fatal: without chapters the description is still valid, just less navigable.
      - name: Add YouTube chapters to the description
        if: steps.video.outcome == 'success'
        continue-on-error: true
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
        run: python scripts/reflection_chapters.py

      # The deliverable, and it never lands as an artifact: the MP4 goes straight from the runner
      # to the channel as a *private* video, with the SEO title and description already applied,
      # so there is nothing to download and nothing to retype. privacyStatus is a constant in
      # youtube_upload.py, not an input — review the video in Studio and publish it from there.
      - name: Upload video to YouTube
        id: youtube
        if: steps.video.outcome == 'success' && env.UPLOAD_TO_YOUTUBE == 'true'
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          # No --summary: the run page carries the QA table and the transcript and nothing else,
          # so the link is printed here instead (and named again by the report step below).
          args=(--video "out/${BASE}.final.mp4"
                --seo "out/seo/${BASE}.seo.md"
                --fallback-title "${BOOK_TITLE} — A reflection on ${CHAPTER_TITLE}")
          if [ -s "out/pics/${BASE}.thumb.jpg" ]; then args+=(--thumbnail "out/pics/${BASE}.thumb.jpg"); fi
          python scripts/youtube_upload.py "${args[@]}"

      # While YouTube is off this is the deliverable, so it fails the job. Named by voice so
      # several voice runs sit side by side; aws's stderr is swallowed as in the save step.
      - name: Upload the video to the bucket
        id: bucket_video
        if: steps.video.outcome == 'success' && env.UPLOAD_TO_YOUTUBE != 'true'
        working-directory: sec10v
        env:
          BUCKET_S3_ENDPOINT: ${{ secrets.BUCKET_S3_ENDPOINT }}
          BUCKET_S3_URI: ${{ secrets.BUCKET_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1   # MinIO accepts any region unless one is configured
          VOICE: ${{ inputs.voice }}
        run: |
          if [ -z "$BUCKET_S3_ENDPOINT" ] || [ -z "$BUCKET_S3_URI" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "⏭️ bucket upload secrets not set (BUCKET_S3_ENDPOINT, BUCKET_S3_URI, BUCKET_ACCESS_KEY_ID, BUCKET_SECRET_ACCESS_KEY) — the video has nowhere to go"
            exit 1
          fi
          voice=$(basename "${VOICE:-default}")
          voice=${voice%.*}
          name="${BASE}.${voice:-default}.mp4"
          file="out/${BASE}.final.mp4"
          aws configure set default.s3.addressing_style path   # MinIO needs path-style
          if err=$(aws s3 cp --endpoint-url "$BUCKET_S3_ENDPOINT" --only-show-errors \
              --content-type video/mp4 "$file" "${BUCKET_S3_URI%/}/${name}" 2>&1 </dev/null); then
            echo "✅ video uploaded to your bucket as ${name} ($(du -h "$file" | cut -f1))"
            echo "   it is at <IMAGE_BASE_URL>/${name}, the same folder the images come from"
          else
            code=$(printf '%s' "${err:-}" | grep -o 'An error occurred ([A-Za-z]*)' | head -n1 || true)
            echo "❌ could not upload ${name}${code:+ — $code}"
            exit 1
          fi

      # Fail loudly *after* the upload, so a finished video is never lost to a late failure.
      - name: Report chunk, image and video status
        working-directory: sec10v
        run: |
          if [ -f out/run_ids.json ]; then
            remaining=$(python -c "import json; d=json.load(open('out/run_ids.json')); print(len(d)); [print(' -', e['out_subdir'], e['run_id']) for e in d]")
          else
            remaining=0   # no chunk run was dispatched at all
          fi
          if [ "$(echo "$remaining" | head -n1)" != "0" ]; then
            echo "❌ chunk run(s) still pending/failed:"; echo "$remaining" | tail -n +2
            echo "These runs failed in the last retry round; rerun this workflow to try again."
            exit 1
          fi
          if [ -f out/chapter.json ]; then
            python - <<'EOF'
          import json
          import os

          # Section 1 has no fallback; the "image 1 never arrived" line below covers it.
          for k, section in enumerate(json.load(open("out/chapter.json"))["sections"], 1):
              if k > 1 and not os.path.exists(f"out/pics/{section['image']}.jpg"):
                  print(f"⚠️ image {k} ({section['image']}.jpg, “{section['heading']}”) never arrived"
                        " — the previous section's image was used instead")
          EOF
          fi
          if [ "${{ steps.qa.outcome }}" = "failure" ]; then
            echo "⚠️ the final QA flagged something — see the Final QA table in the run summary"
          fi
          # This run uploads no artifacts at all; the channel is where the output went.
          if [ "${{ steps.youtube.outcome }}" = "success" ]; then
            echo "📺 uploaded to YouTube as private — the link is in the upload step's log"
          fi
          if [ "${{ steps.bucket_video.outcome }}" = "success" ]; then
            echo "🪣 video uploaded to your bucket — the name is in the \"Upload the video to the bucket\" step's log"
          fi
          if [ "${{ steps.image.outputs.found }}" != "true" ] && [ "${{ steps.image_retry.outputs.found }}" != "true" ]; then
            echo "⚠️ image 1 never arrived — no video was built, nothing was uploaded to YouTube."
            echo "   Upload ${BASE}.1.jpg to the bucket and re-run: the script is read from there, and the"
            echo "   prompts and SEO were saved there too (if the BUCKET_* secrets are set)."
          fi

      # Last on purpose. $GITHUB_STEP_SUMMARY renders blocks in the order steps append them, so
      # the page reads: the Final QA table (from verify_final.py), then this — the one thing a
      # finished run still needs a human for, fenced for copy-paste into YouTube's subtitle box.
      # ~33 KB against the 1 MiB per-step cap. The transcript *file* is written much earlier, by
      # transcript.py, so it survives a failure in between; `if: always()` publishes it even when
      # the video or the upload failed (a job cancelled by timeout skips this, but such a run has
      # no video to subtitle either).
      - name: Publish the transcript to the summary
        if: always()
        working-directory: sec10v
        run: |
          transcript="out/${BASE}.transcript.txt"
          if [ -s "$transcript" ]; then
            {
              echo
              echo "### Transcript (upload as the subtitle track)"
              echo
              printf '```text\n'; cat "$transcript"; printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "transcript written to the run summary ($(wc -c < "$transcript") bytes)"
          else
            echo "⚠️ no $transcript to publish"
          fi
