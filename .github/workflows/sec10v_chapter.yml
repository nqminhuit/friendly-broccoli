# A chapter file in this repo turns into a word-for-word audiobook video of that chapter. Pushing
# chapters/<name>.md to master starts one run per added or changed file (see chapters/README.md
# for the format); a manual dispatch re-runs one file, optionally with another voice. A commit
# message with [skip ci] pushes without a run.
#
#   You author the whole file: front matter (book, author, chapter, title, description,
#   thumbnail; voice, tts_names, source_url, motion optional) and the narration with its
#   ![](image) lines. No LLM is involved, and nothing is fetched at build time — source_url is
#   provenance only.
#   prepare_markdown_chapter.py reads it → the required image names are listed (a configuration
#   failure here stops the run before any chunk is dispatched) → trigger_workflow.py fans out one
#   sec10v.yml run per chunk → reflection_images.py waits for the file's images while the chunks
#   synthesize (a second window follows the audio collection) → import_artifacts_mp3s.py collects
#   the audio → automate_audiobook.py builds the video with the motion profile the file chose
#   (static 5 fps, or Ken Burns 30 fps with 1s/1.5s fades when motion: true) → video_fallback.py
#   uploads the video to YouTube as private.
#   A missing image skips the build/upload with a warning; upload the images then rerun.
#   The narrator voice is the file's `voice:` (default: the audiobook voice); the dispatch's
#   voice input overrides it for voice tests. Reuse is identity-safe: per-chunk audio is reused
#   only when its sidecar matches the chunk text, voice, rate, reference and audio digests;
#   audio without a sidecar is regenerated once. The file's authored SEO is used as-is.
#
# Fallback-only saved-video retries: YouTube is tried first; a successful first upload
# stores NO bundle/receipt in storage. Only when the VIDEO upload fails is the finished
# bundle saved to the existing S3-compatible bucket/private video prefix, and the job
# STILL FAILS visibly so the same file is triggered again next day. That retry restores
# the MATCHING failed-upload bundle and retries only YouTube — no image waits/TTS/cache
# warm/audio collection/FFmpeg/repeated QA. Changed source/voice/settings/refs or fresh
# bypass reuse; images replaced under the SAME ref need fresh too. The file's motion
# profile is part of that identity, so changing it rebuilds the video. A stored success
# receipt suppresses duplicates; ambiguous prior completion stops for manual review.
# Thumbnail failure alone is not a failed video upload.
# Requires sec10v scripts/video_fallback.py and scripts/prepare_markdown_chapter.py at the
# selected sec10v_ref (two-repo dependency: merge/select those helpers before using this workflow).
#
# This repo is public: write image refs as names relative to the image bucket prefix, never as
# bucket URLs. Generated names are Chapter.<CamelCase(file-stem)>; two files that differ only by
# punctuation (the-blue-cross.md vs the_blue_cross.md) collide and are refused before any build.
# Review the private upload in YouTube Studio before publishing it (an unaudited client's
# uploads are force-locked to private; official docs default to 100 videos.insert calls/day).
#
# Secrets — Settings → Secrets and variables → Actions → Secrets:
#   CHAPTER_IMAGE_BUCKET  image bucket name only (no scheme, no slash); relative image refs
#                        resolve against it (required)
#   CHAPTER_IMAGE_PREFIX  optional key prefix inside that bucket, no trailing slash
#   SEC10V_ACCESS_TOKEN   also used by sec10v.yml
#   YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN
#   HF_TOKEN
#   BUCKET_S3_ENDPOINT, BUCKET_S3_URI, BUCKET_ACCESS_KEY_ID, BUCKET_SECRET_ACCESS_KEY
#                        failed-upload bundles only (read/write; deletion optional, best-effort
#                        after the success receipt). The prefix must deny anonymous read.
#                        The same keys also read the images, so they need read access on the image bucket.
name: sec10v chapter
run-name: ${{ inputs.file || github.event.head_commit.message }}

on:
  push:
    branches: [master]
    paths:
      - 'chapters/**.md'
      - '!chapters/README.md'
      - '!chapters/**/README.md'
      - '!chapters/AGENTS.md'
      - '!chapters/**/AGENTS.md'
  workflow_dispatch:
    inputs:
      file:
        description: 'Chapter file to (re-)build, e.g. chapters/the-blue-cross.md'
        required: true
        type: string
      voice:
        description: 'Narrator voice (sec10v resources/voices/); (from file) uses the file''s voice: (default: the audiobook voice)'
        required: false
        type: choice
        default: '(from file)'
        options:
          - '(from file)'
          - '_live/thestorygirl_sentimentalsongbook_05_moore_128kb.mp3'
          - '_live/maddpren_enhanced_cut_magician_12_maugham_128kb.wav'
          - '_live/maddpren_enhance_cut_magician_12_maugham_128kb.mp3'
          - '_live/DianeAlailima_bedtimestories_36_anonymous_128kb.cleaned.mp3'
          - '_live/DianeAlailima_cut_wondergarden_122_olcott_128kb.mp3'
          - '_live/DianeAlailima_wondergarden_121_olcott_128kb.cleaned.mp3'
          - '_live/DianeAlailima_wondergarden_122_olcott_128kb.cleaned.mp3'
          - '_live/HannahC_cut_girlsofstcyprians_09_brazil_128kb.mp3'
          - '_live/LesWilLang_cut_ladyofthearoostook_02_howells_128kb.mp3'
          - '_live/Rapunzelina_cut_essaysonart_34_goethe_128kb.mp3'
          - '_live/TriciaG_cut_bobbyswolf_31_pansy_128kb.mp3'
          - '_live/TriciaG_cut_ssc115_02_various_128kb.mp3'
          - '_live/thestorygirl_clean9s.mp3'
          - '_live/thestorygirl_cut_cm2_02_mason_128kb.mp3'
          - '_live/stacea-voice-elegant-06.wav'
          - '_live/stacea-voice-sweet-12.wav'
          - '_live/stacea-voice-ai-07.wav'
      sec10v_ref:
        description: 'nqminhuit/sec10v ref to check out'
        required: false
        type: string
        default: 'master'
      fresh:
        description: 'Start fresh: rebuild from scratch, bypassing a saved failed-upload video (check the channel first — an ambiguous prior completion can create a duplicate upload)'
        required: false
        type: boolean
        default: false

env:
  IMAGE_EARLY_WAIT_MINUTES: '20'   # while the chunk runs synthesize — free, otherwise idle in collection
  IMAGE_WAIT_MINUTES: '60'         # second chance, after the audio is collected
  MAX_CHUNKS: '60'                 # ~20 chunks take 41-81 min; more than this can't be collected in 200
  VOICE_FROM_FILE: '(from file)'   # the voice input's default; keep in sync with its options

permissions:
  actions: write        # dispatch sec10v.yml runs in this repo and read their artifacts
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}   # the event commit: never a moving master for a manual dispatch
          fetch-depth: 0           # the push diff needs the `before` commit
          persist-credentials: false

      - name: List the chapter files to build
        id: list
        env:
          EVENT: ${{ github.event_name }}
          FILE: ${{ inputs.file }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/select_chapter_files.py \
            --event "$EVENT" --file "$FILE" --before "$BEFORE" --sha "$SHA" \
            --output "$GITHUB_OUTPUT"

  chapter:
    needs: files
    if: needs.files.outputs.files != '[]'
    name: ${{ matrix.file }}
    runs-on: ubuntu-latest
    # One run per file at a time: two would fan out duplicate chunk runs and overwrite each other's video.
    # A newer pending run replaces an older pending one, so the latest push of the file is what builds.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.file }}
      cancel-in-progress: false
    strategy:
      matrix:
        file: ${{ fromJSON(needs.files.outputs.files) }}
      max-parallel: 1   # each file fans out ~20 chunk runs of its own
      fail-fast: false
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}   # build the exact content that was selected, not master's head
          fetch-depth: 1
          persist-credentials: false

      # Never prints the image bucket or prefix: they are secrets, and only the filenames are needed.
      - name: Show workflow inputs
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          FILE: ${{ matrix.file }}
          SEC10V_REF: ${{ inputs.sec10v_ref || 'master' }}
          VOICE_OVERRIDE: ${{ inputs.voice || env.VOICE_FROM_FILE }}
          FRESH: ${{ inputs.fresh }}
        run: |
          {
            echo "### Workflow Inputs"
            echo "- Chapter file: \`$FILE\` ($EVENT)"
            echo "- Voice: \`$VOICE_OVERRIDE\`"
            echo "- Fresh: \`${FRESH:-false}\`"
            echo "- sec10v ref: \`$SEC10V_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Chapter file: $FILE ($EVENT)"
          echo "Voice: $VOICE_OVERRIDE"
          echo "Fresh: ${FRESH:-false}"
          echo "sec10v ref: $SEC10V_REF"

      - name: Checkout nqminhuit/sec10v
        uses: actions/checkout@v7
        with:
          repository: nqminhuit/sec10v
          path: sec10v
          ref: ${{ inputs.sec10v_ref || 'master' }}
          token: ${{ secrets.SEC10V_ACCESS_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The main runner never runs TTS itself; requests is all the sec10v scripts here import.
      # (automate_audiobook.py is stdlib-only and skips TTS entirely when the MP3s exist.)
      - name: Install Python dependencies
        run: pip install requests

      # Gated before restore or any expensive work so an unsupported ref wastes no runner time.
      - name: Check the chapter preparer version
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
        run: |
          if ! python - <<'PY'
          from prepare_markdown_chapter import MARKDOWN_CHAPTER_VERSION
          if MARKDOWN_CHAPTER_VERSION < 1:
              raise SystemExit(1)
          PY
          then
            echo "❌ this sec10v_ref has no prepare_markdown_chapter.py v1 — use a newer sec10v_ref"
            exit 1
          fi

      - name: Prepare the chapter from your file
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          FILE: ${{ matrix.file }}   # via env, never spliced into the script body
          VOICE_OVERRIDE: ${{ inputs.voice }}
        run: |
          args=(--script-file "$GITHUB_WORKSPACE/$FILE" --max-chunks "$MAX_CHUNKS")
          if [ -n "$VOICE_OVERRIDE" ] && [ "$VOICE_OVERRIDE" != "$VOICE_FROM_FILE" ]; then args+=(--voice "$VOICE_OVERRIDE"); fi
          python scripts/prepare_markdown_chapter.py "${args[@]}"
          # Export the parsed/inferred values for the later steps. The effective render profile is
          # the file's, so it must be a single allowed value before it reaches $GITHUB_ENV.
          python - <<'EOF' >> "$GITHUB_ENV"
          import json
          d = json.load(open("out/chapter.json"))
          values = {}
          for env, key in (("BASE", "base_name"), ("BOOK_TITLE", "book_title"),
                           ("CHAPTER_TITLE", "chapter_title"),
                           ("AUTHOR", "author"), ("VOICE", "voice")):
              value = d[key]
              assert isinstance(value, str) and "\n" not in value, key
              values[env] = value
          motion = d["video_motion"]
          framerate = str(d["video_framerate"])
          fade_in = str(d["fade_in_seconds"])
          fade_out = str(d["fade_out_seconds"])
          assert motion in ("static", "ken-burns"), motion
          if motion == "ken-burns":
              assert (framerate, fade_in, fade_out) == ("30", "1", "1.5"), (framerate, fade_in, fade_out)
          else:
              assert (framerate, fade_in, fade_out) == ("5", "0", "0"), (framerate, fade_in, fade_out)
          values["VIDEO_MOTION"] = motion
          values["VIDEO_FRAMERATE"] = framerate
          values["FADE_IN_SECONDS"] = fade_in
          values["FADE_OUT_SECONDS"] = fade_out
          for env, value in values.items():
              print(f"{env}={value}")
          EOF
          echo "--- out/text ---"; ls -la out/text
          echo "--- dispatch manifest ---"; python -c "import json; print(len(json.load(open('out/workflow-input.json'))), 'item(s)')"

      # YouTube takes an untimed transcript and aligns it to the audio itself, so this is just
      # the script text — the exact words the TTS read. Written here, right after the text exists,
      # so it survives a failure anywhere later in the run.
      - name: Write the YouTube transcript
        working-directory: sec10v
        run: |
          echo "::group::transcript"
          python scripts/transcript.py
          echo "::endgroup::"

      # Retry-only: restores a MATCHING bundle saved by a prior failed YouTube upload and
      # retries only the upload — no TTS/images/FFmpeg/QA. Miss means render normally.
      # Runs before reuse_audio rewrites the manifest or any expensive work starts. The effective
      # profile was exported above, so the restored identity is compared against the file's.
      - name: Restore a video from a failed upload
        id: fallback
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          FILE: ${{ matrix.file }}
          FRESH: ${{ inputs.fresh }}
          BUCKET_S3_ENDPOINT: ${{ secrets.BUCKET_S3_ENDPOINT }}
          BUCKET_S3_URI: ${{ secrets.BUCKET_S3_URI }}
          BUCKET_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            echo "❌ AWS CLI is required for the failed-upload lookup"
            exit 1
          fi
          if [ ! -f scripts/video_fallback.py ]; then
            echo "❌ selected sec10v ref lacks scripts/video_fallback.py — use a newer sec10v_ref"
            exit 1
          fi
          args=(restore --kind chapter --source-id "$FILE" --source-file "$GITHUB_WORKSPACE/$FILE" --workflow-file "$GITHUB_WORKSPACE/.github/workflows/sec10v_chapter.yml" --out-dir out)
          if [ "$FRESH" = "true" ]; then args+=(--force); fi
          python scripts/video_fallback.py "${args[@]}"

      # A run that died after the audio (no image, a broken encode, a timeout) left its MP3s in
      # an artifact named after the BaseName. Fetch them instead of spending another 40 minutes
      # of runners recreating them. Opportunistic: no artifact, an expired one or a network
      # failure all just mean "synthesize from scratch". Strict reuse pairs each MP3 with its
      # .audio.json identity sidecar from the same run and reuses it only on matching text,
      # voice, rate, reference and audio digests; audio without identity is regenerated once.
      #
      # `fresh` skips it outright: nothing on disk means pending_chunks.py finds every chunk
      # missing, so all the audio is re-synthesized. That is the escape hatch for a previous
      # run whose MP3s are bad rather than absent — a truncated chunk that still passed its own
      # QA, a voice change, an edited chapter text. The file's authored SEO is never touched.
      - name: Reuse audio from a previous run of this chapter
        if: ${{ !inputs.fresh && steps.fallback.outputs.status == 'miss' }}
        continue-on-error: true
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/reuse_audio.py \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --token "${{ secrets.GITHUB_TOKEN }}"

      # With whatever was reused now on disk, this rewrites the manifest down to the chunks that
      # are genuinely missing, and reports what the rest of the run still has to do. The file
      # already wrote the SEO, so there is no creative cache to consult.
      - name: Decide what still needs doing
        id: tts
        if: ${{ steps.fallback.outputs.status == 'miss' }}
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
        run: |
          set +e
          python scripts/pending_chunks.py --rewrite
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "needs_tts=false" >> "$GITHUB_OUTPUT"
              echo "✅ every chunk's audio is already here — skipping the weights cache, the"
              echo "   dispatch and the collection, straight to the image and the video"
              ;;
            10) echo "needs_tts=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      # Before the image pickup, whose convert_to_jpg needs it; the video build needs it too.
      - name: Install ffmpeg
        if: ${{ steps.fallback.outputs.status == 'miss' }}
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n1
            exit 0
          fi
          # Must be a full apt-get update: Ubuntu 24.04 keeps its repositories in
          # /etc/apt/sources.list.d/ubuntu.sources (deb822), so a narrowed update refreshes no
          # index at all and apt resolves package versions from the image's stale one — those 404
          # once the mirror moves on (e.g. libssh-gcrypt-4 0.10.6-2ubuntu0.4).
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg \
            || sudo apt-get install -y --no-install-recommends --fix-missing ffmpeg
          ffmpeg -version | head -n1

      # Validation-only (no outputs, no TTS): the file's music cues are checked against the
      # canonical assets/durations with ffprobe. Needs ffmpeg above and must fail before any chunk
      # is dispatched or weights are warmed — a cached-narration run still needs its music checked,
      # so this guards on miss, not needs_tts. Never runs the normal prepare here (a rewritten
      # pending manifest and the authored outputs/identity must survive).
      - name: Check the chapter music ranges
        if: ${{ steps.fallback.outputs.status == 'miss' }}
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          FILE: ${{ matrix.file }}   # via env, never spliced into the script body
          VOICE_OVERRIDE: ${{ inputs.voice }}
        run: |
          args=(--script-file "$GITHUB_WORKSPACE/$FILE" --check-music)
          if [ -n "$VOICE_OVERRIDE" ] && [ "$VOICE_OVERRIDE" != "$VOICE_FROM_FILE" ]; then args+=(--voice "$VOICE_OVERRIDE"); fi
          python scripts/prepare_markdown_chapter.py "${args[@]}"

      # The file's image names are listed here before anything is dispatched; a malformed manifest
      # or a missing/dedicated-thumbnail problem fails now rather than after ~40 minutes of TTS.
      # Image refs resolve against the image bucket and prefix (secrets, never printed).
      - name: Check the chapter image configuration
        if: ${{ steps.fallback.outputs.status == 'miss' }}
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          FILE: ${{ matrix.file }}
          IMAGE_BUCKET: ${{ secrets.CHAPTER_IMAGE_BUCKET }}
          IMAGE_PREFIX: ${{ secrets.CHAPTER_IMAGE_PREFIX }}
          BUCKET_S3_ENDPOINT: ${{ secrets.BUCKET_S3_ENDPOINT }}
          BUCKET_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$IMAGE_BUCKET" ]; then
            echo "❌ the CHAPTER_IMAGE_BUCKET secret is not set — the file's image names resolve against the image bucket"
            exit 1
          fi
          missing=""
          for name in BUCKET_S3_ENDPOINT BUCKET_ACCESS_KEY_ID BUCKET_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "❌ missing secret(s) needed to read the images:$missing"
            exit 1
          fi
          # Fixed message: a malformed secret must never leak back into the log.
          case "$IMAGE_BUCKET" in
            */*|*://*) echo "❌ CHAPTER_IMAGE_BUCKET must be a bare bucket name (no slash, no scheme)"; exit 1 ;;
          esac
          python - <<'EOF'
          import json

          def bad_ref(ref):
              # The docs require bucket-relative names: no scheme, no leading slash, no query or
              # fragment and no '..' traversal. A rejected ref is never echoed back.
              if not isinstance(ref, str) or not ref:
                  return True
              if ref.startswith("/") or "://" in ref or "?" in ref or "#" in ref:
                  return True
              return ".." in ref.split("/")

          with open("out/chapter.json") as f:
              chapter = json.load(f)
          if not isinstance(chapter, dict):
              raise SystemExit("❌ out/chapter.json is not a chapter mapping")
          base = chapter.get("base_name")
          if not isinstance(base, str) or not base:
              raise SystemExit("❌ out/chapter.json has no base_name")
          images = chapter.get("images")
          if not isinstance(images, list) or not images:
              raise SystemExit("❌ no images in out/chapter.json — the prepare step produced no manifest")
          for entry in images:
              chunks = entry.get("chunks") if isinstance(entry, dict) else None
              if (not isinstance(entry, dict)
                      or not isinstance(entry.get("name"), str) or not entry["name"]
                      or not isinstance(entry.get("ref"), str) or not entry["ref"]
                      or not isinstance(chunks, list) or not chunks
                      or not all(isinstance(c, int) for c in chunks)):
                  raise SystemExit("❌ out/chapter.json images must list entries with a name, a ref and chunk numbers")
              if bad_ref(entry["ref"]):
                  raise SystemExit("❌ image refs must be bucket-relative names without a scheme, query or '..'")
          thumbnail = chapter.get("thumbnail")
          if not isinstance(thumbnail, str) or not thumbnail or bad_ref(thumbnail):
              raise SystemExit("❌ out/chapter.json needs a bucket-relative thumbnail ref")
          if thumbnail in {entry["ref"] for entry in images}:
              raise SystemExit("❌ the thumbnail must be a dedicated image, distinct from the body images")
          print(f"🖼️ images come from your file: {len(images)} image(s) to upload while the chunks synthesize")
          for image in images:
              print(f"• {image['name']} ({image['ref']}) — chunk(s) {', '.join(map(str, image['chunks']))}")
          print(f"• thumbnail ({thumbnail})")
          with open("out/workflow-input.json") as f:
              items = json.load(f)
          if not isinstance(items, list) or not items:
              raise SystemExit("❌ empty dispatch manifest out/workflow-input.json")
          print(f"dispatch manifest: {len(items)} item(s)")
          EOF

      # One hub download per chapter instead of one per chunk: the chunk runs restore this
      # same cache key and then run with HF_HUB_OFFLINE=1. Without it they all hit Hugging
      # Face at the same moment and got HTTP 429. The key must stay identical to the one in
      # sec10v.yml — both hash the requirements file that pins chatterbox-tts.
      - name: Restore the Chatterbox weights cache
        id: hf_cache
        if: ${{ steps.fallback.outputs.status == 'miss' && steps.tts.outputs.needs_tts == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-chatterbox-${{ hashFiles('sec10v/requirements_no_cuda.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-chatterbox-

      - name: Warm the Chatterbox weights cache
        if: ${{ steps.fallback.outputs.status == 'miss' && steps.tts.outputs.needs_tts == 'true' && steps.hf_cache.outputs.cache-hit != 'true' }}
        working-directory: sec10v
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Two separate installs on purpose: --no-deps applies to every package in a pip
          # command, so installing both together left huggingface_hub without httpx and the
          # fetch died with ModuleNotFoundError. huggingface_hub needs its dependencies;
          # chatterbox-tts is code-only here, just so hf_weights.py can read the weight list
          # out of the version this chapter will actually run with.
          pip install --quiet huggingface_hub
          pin=$(grep -m1 '^chatterbox-tts==' requirements_no_cuda.txt)
          pip install --quiet --no-deps "${pin:-chatterbox-tts}"
          python scripts/hf_weights.py --no-stagger
          du -sh ~/.cache/huggingface

      - name: Save the Chatterbox weights cache
        if: ${{ steps.fallback.outputs.status == 'miss' && steps.tts.outputs.needs_tts == 'true' && steps.hf_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true   # a concurrent run may have reserved the same key already
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-chatterbox-${{ hashFiles('sec10v/requirements_no_cuda.txt') }}

      # Dispatch → wait → re-dispatch only what is missing. A chunk run can die on its own
      # (hub rate limit, flaky mirror, the QA retry giving up), and the runner has no
      # persistent out/ to resume from, so pending_chunks.py rebuilds the manifest from the
      # audio that actually landed: exit 0 = complete, 10 = it rewrote the manifest with the
      # stragglers, anything else = broken. trigger_workflow.py returns as soon as the runs are
      # dispatched; the collect step below waits for them. Round 1 is dispatched in its own step
      # purely so the image wait below can slot in between dispatch and collection.
      - name: Dispatch one sec10v.yml run per chunk
        if: ${{ steps.fallback.outputs.status == 'miss' && steps.tts.outputs.needs_tts == 'true' }}
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/trigger_workflow.py \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --workflow sec10v.yml \
            --ref master \
            --inputs-file out/workflow-input.json \
            --token "${{ secrets.GITHUB_TOKEN }}"

      # Costs nothing: without it the job would spend these minutes idle inside the collector's
      # poll. A wrong filename or a corrupt upload shows up here while you can still act on it.
      - name: Wait for the chapter images (while the chunks synthesize)
        id: image
        if: ${{ steps.fallback.outputs.status == 'miss' }}
        timeout-minutes: 60   # safety net only; reflection_images.py enforces its own deadline
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          IMAGE_BUCKET: ${{ secrets.CHAPTER_IMAGE_BUCKET }}
          IMAGE_PREFIX: ${{ secrets.CHAPTER_IMAGE_PREFIX }}
          BUCKET_S3_ENDPOINT: ${{ secrets.BUCKET_S3_ENDPOINT }}
          BUCKET_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
        run: |
          wait_minutes=${IMAGE_EARLY_WAIT_MINUTES%%.*}
          if [ "${wait_minutes:-0}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ skipping the early image wait (IMAGE_EARLY_WAIT_MINUTES=0)"
            exit 0
          fi
          if [ -z "$IMAGE_BUCKET" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ no CHAPTER_IMAGE_BUCKET secret — skipping the early image wait"
            exit 0
          fi
          set +e
          python scripts/reflection_images.py --timeout "$((wait_minutes * 60))" --poll-interval 20
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "✅ every required image arrived — the video will build as soon as the audio lands"
          elif [ "$rc" -eq 10 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏳ image(s) still missing — audio collection proceeds and there is a second chance after it"
          else
            echo "❌ reflection_images.py failed (exit $rc)"
            exit "$rc"
          fi

      - name: Collect MP3s, retry stragglers
        if: ${{ steps.fallback.outputs.status == 'miss' && steps.tts.outputs.needs_tts == 'true' }}
        working-directory: sec10v
        timeout-minutes: 200   # bounds the polling loop below; the job cap is 330
        env:
          PYTHONPATH: scripts
        run: |
          rounds=3
          for round in $(seq 1 "$rounds"); do
            if [ "$round" -gt 1 ]; then
              echo "::group::round $round — re-dispatch the missing chunk(s)"
              # trigger_workflow.py rewrites out/run_ids.json, so each round polls only its own runs.
              python scripts/trigger_workflow.py \
                --owner "${{ github.repository_owner }}" \
                --repo "${{ github.event.repository.name }}" \
                --workflow sec10v.yml \
                --ref master \
                --inputs-file out/workflow-input.json \
                --token "${{ secrets.GITHUB_TOKEN }}"
              echo "::endgroup::"
            fi

            # Round 1 dispatches 30+ runs, which queue behind GitHub's concurrency limit, so a
            # chunk can legitimately take ~45 min end to end. Later rounds have the runners to
            # themselves.
            if [ "$round" -eq 1 ]; then collect_timeout=5400; else collect_timeout=2700; fi

            while :; do
              echo "::group::round $round — wait and collect"
              python scripts/import_artifacts_mp3s.py \
                --download --move \
                --poll-interval 60 --timeout "$collect_timeout" \
                --token "${{ secrets.GITHUB_TOKEN }}"
              echo "::endgroup::"

              set +e
              python scripts/pending_chunks.py --rewrite
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                echo "✅ every chunk present after round $round"
                break 2
              fi
              if [ "$rc" -ne 10 ]; then exit "$rc"; fi

              # Audio is missing — but only re-dispatch runs that have actually finished.
              # Re-dispatching one that is merely slow duplicates ~40 minutes of TTS and makes
              # the wait *longer*: chunk 27 once ran 04:26-05:12 while the loop gave up at
              # 05:06 and started a copy at 05:08.
              if python scripts/runs_alive.py --token "${{ secrets.GITHUB_TOKEN }}"; then
                echo "⏳ chunk run(s) still in flight — polling again instead of re-dispatching"
                continue
              fi
              break
            done

            if [ "$round" -eq "$rounds" ]; then
              echo "❌ still missing chunk(s) after $rounds round(s)"
              exit 1
            fi
            echo "🔁 round $((round + 1)) will re-dispatch only the missing chunk(s)"
          done
          echo "--- out/*.mp3 ---"; ls -la out/*.mp3

      # Second chance, for when the images were not up yet during the synthesis window.
      # Existing downloads stay in out/pics, so only missing refs are fetched.
      - name: Wait for the chapter images (second chance)
        id: image_retry
        if: ${{ steps.fallback.outputs.status == 'miss' && steps.image.outputs.found != 'true' }}
        timeout-minutes: 180   # safety net only; reflection_images.py enforces --timeout itself
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          IMAGE_BUCKET: ${{ secrets.CHAPTER_IMAGE_BUCKET }}
          IMAGE_PREFIX: ${{ secrets.CHAPTER_IMAGE_PREFIX }}
          BUCKET_S3_ENDPOINT: ${{ secrets.BUCKET_S3_ENDPOINT }}
          BUCKET_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
        run: |
          wait_minutes=${IMAGE_WAIT_MINUTES%%.*}
          if [ "${wait_minutes:-0}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ image wait disabled (IMAGE_WAIT_MINUTES=0)"
            exit 0
          fi
          if [ -z "$IMAGE_BUCKET" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ no CHAPTER_IMAGE_BUCKET secret — skipping the video"
            exit 0
          fi
          set +e
          python scripts/reflection_images.py --timeout "$((wait_minutes * 60))" --poll-interval 20
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            ls -la out/pics
          elif [ "$rc" -eq 10 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ image(s) still missing after the second window — no video was built"
          else
            echo "❌ reflection_images.py failed (exit $rc)"
            exit "$rc"
          fi

      # Only when every required image (and the dedicated thumbnail) arrived. The file's motion
      # profile decides static 5 fps or Ken Burns 30 fps with fades; no crossfade or music bed is
      # forced on a chapter. No segment-images means the collector never wrote them.
      - name: Build the final video
        id: video
        if: ${{ steps.fallback.outputs.status == 'miss' && (steps.image.outputs.found == 'true' || steps.image_retry.outputs.found == 'true') }}
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          PYTHONUNBUFFERED: '1'   # so the per-segment progress lines stream instead of arriving at the end
        run: |
          # Preflight: every mp3 must exist, or automate_audiobook would shell out to audiobook.py
          # and fail on the torch this runner deliberately doesn't have.
          python scripts/pending_chunks.py
          args=("$BASE" --segment-images out/segment-images.json \
            --framerate "$VIDEO_FRAMERATE" --fade-in "$FADE_IN_SECONDS" --fade-out "$FADE_OUT_SECONDS")
          if [ "$VIDEO_MOTION" = "ken-burns" ]; then args+=(--ken-burns); fi
          python scripts/automate_audiobook.py "${args[@]}"
          ls -lh out/*.final.mp4

      # whisper-cli for the spot-check below. Restore only, never build: the chunk runs populate
      # this exact cache key, and a QA nicety is not worth a 10-minute compile on a miss —
      # verify_final.py just reports the spot-check as skipped when the binary isn't there.
      - name: Check out whisper.cpp for the final QA
        if: steps.video.outcome == 'success'
        uses: actions/checkout@v7
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: master
          fetch-depth: 1

      - name: Get whisper.cpp HEAD SHA
        id: whisper-sha
        if: steps.video.outcome == 'success'
        run: echo "sha=$(git -C whisper.cpp rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Restore the whisper.cpp build
        if: steps.video.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: |
            whisper.cpp/build
            whisper.cpp/models/ggml-small.en.bin
          key: ${{ runner.os }}-whisper-cpp-${{ steps.whisper-sha.outputs.sha }}-cpu-compat

      # What the per-chunk QA structurally cannot see: a missing, duplicated, misordered or
      # truncated segment. Duration arithmetic catches the first three for the price of an
      # ffprobe; three sampled 30s windows located in the transcript catch the rest. A full
      # transcription would cost 20-30 min of runner time to re-check text the chunk runs
      # already verified.
      - name: Verify the final video
        id: qa
        if: steps.video.outcome == 'success'
        continue-on-error: true
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          PYTHONUNBUFFERED: '1'
        run: |
          # Save the table so a later upload-only retry can republish it without re-running QA.
          set +e
          python scripts/verify_final.py \
            --whisper-cli "${{ github.workspace }}/whisper.cpp/build/bin/whisper-cli" \
            --model "${{ github.workspace }}/whisper.cpp/models/ggml-small.en.bin" \
            --summary "out/${BASE}.qa.md"
          rc=$?
          set -e
          if [ -s "out/${BASE}.qa.md" ]; then cat "out/${BASE}.qa.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"

      # Upload-only retry path: the restored bundle already has its QA results, so republish
      # its saved table instead of re-running ffprobe/whisper/TTS.
      - name: Restore the saved QA summary
        if: ${{ steps.fallback.outputs.status == 'restored' }}
        working-directory: sec10v
        run: |
          qa="out/${BASE}.qa.md"
          if [ -s "$qa" ]; then
            cat "$qa" >> "$GITHUB_STEP_SUMMARY"
            echo "restored saved QA summary"
          else
            echo "no saved QA summary to restore"
          fi

      # The deliverable, and it never lands as an artifact: the MP4 goes straight from the runner
      # to the channel as a *private* video, with the file's authored SEO title and description
      # already applied, so there is nothing to download and nothing to retype. privacyStatus is a
      # constant in youtube_upload.py, not an input — review the video in Studio and publish it.
      # A failure here fails the job; a retry restores the saved bundle and retries only the upload.
      - name: Upload video to YouTube
        id: youtube
        if: ${{ steps.video.outcome == 'success' || steps.fallback.outputs.status == 'restored' }}
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BUCKET_S3_ENDPOINT: ${{ secrets.BUCKET_S3_ENDPOINT }}
          BUCKET_S3_URI: ${{ secrets.BUCKET_S3_URI }}
          BUCKET_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
        run: |
          # No --summary: the run page carries the QA table and the transcript and nothing else,
          # so the link is printed here instead (and named again by the report step below).
          # First success writes nothing to storage; a failed VIDEO upload saves the bundle
          # and still exits nonzero so the job visibly fails.
          if ! command -v aws >/dev/null 2>&1; then
            echo "❌ AWS CLI is required for the failed-upload save"
            exit 1
          fi
          if [ ! -f scripts/video_fallback.py ]; then
            echo "❌ selected sec10v ref lacks scripts/video_fallback.py — use a newer sec10v_ref"
            exit 1
          fi
          thumbnail="out/pics/${BASE}.thumb.jpg"
          if [ ! -s "$thumbnail" ]; then
            echo "❌ no dedicated thumbnail at $thumbnail — the file names one and it must arrive before the build"
            exit 1
          fi
          args=(upload --video "out/${BASE}.final.mp4"
                --seo "out/seo/${BASE}.seo.md"
                --fallback-title "${BOOK_TITLE} — ${CHAPTER_TITLE}"
                --thumbnail "$thumbnail"
                --out-dir out)
          python scripts/video_fallback.py "${args[@]}"

      # Fail loudly *after* the upload, so a finished video is never lost to a late failure.
      - name: Report chunk, image and video status
        working-directory: sec10v
        env:
          IMAGE_FOUND: ${{ steps.image.outputs.found }}
          IMAGE_RETRY_FOUND: ${{ steps.image_retry.outputs.found }}
          FALLBACK_STATUS: ${{ steps.fallback.outputs.status }}
        run: |
          if [ "$FALLBACK_STATUS" = "restored" ]; then
            echo "♻️ restored a saved video from a failed upload — no synthesis or render ran"
            if [ "${{ steps.youtube.outcome }}" = "success" ]; then
              echo "📺 uploaded to YouTube as private — the link is in the upload step's log"
            fi
            exit 0
          fi
          if [ "$FALLBACK_STATUS" = "uploaded" ]; then
            echo "✅ video already uploaded (existing receipt) — no new video needed"
            exit 0
          fi
          if [ -f out/run_ids.json ]; then
            remaining=$(python -c "import json; d=json.load(open('out/run_ids.json')); print(len(d)); [print(' -', e['out_subdir'], e['run_id']) for e in d]")
          else
            remaining=0   # no chunk run was dispatched at all (audio came from a previous run)
          fi
          if [ "$(echo "$remaining" | head -n1)" != "0" ]; then
            echo "❌ chunk run(s) still pending/failed:"; echo "$remaining" | tail -n +2
            echo "These runs failed in the last retry round; rerun this workflow to try again."
            exit 1
          fi
          if [ "${{ steps.qa.outcome }}" = "failure" ]; then
            echo "⚠️ the final QA flagged something — see the Final QA table in the run summary"
          fi
          # This run uploads no artifacts at all; the channel is where the output went.
          if [ "${{ steps.youtube.outcome }}" = "success" ]; then
            echo "📺 uploaded to YouTube as private — the link is in the upload step's log"
          fi
          if [ "$IMAGE_FOUND" != "true" ] && [ "$IMAGE_RETRY_FOUND" != "true" ]; then
            echo "⚠️ no video was built or uploaded — required image(s) never arrived."
          python - <<'EOF'
          import json
          import os

          def safe_ref(ref):
              # Chapter refs are bucket-relative names, so only the path is ever shown.
              return ref.split("?", 1)[0].split("#", 1)[0] if isinstance(ref, str) else ""

          chapter = json.load(open("out/chapter.json"))
          base = chapter.get("base_name")
          images = chapter.get("images") or []
          # Check the manifest name the collector actually wrote, not a name inferred from the
          # position: the cover image's manifest name is img1, and a stale <base>.jpg must not
          # hide a genuinely missing first image.
          for image in images:
              if not (isinstance(image, dict) and isinstance(image.get("name"), str) and image["name"]):
                  continue
              name = image["name"]
              path = f"out/pics/{name}.jpg"
              if not (os.path.isfile(path) and os.path.getsize(path) > 0):
                  ref = image.get("ref", "") if isinstance(image.get("ref"), str) else ""
                  shown = f" ({safe_ref(ref)})" if safe_ref(ref) else ""
                  print(f"❌ missing {name}.jpg{shown}")
          thumbnail = chapter.get("thumbnail")
          if isinstance(thumbnail, str) and thumbnail:
              path = f"out/pics/{base}.thumb.jpg"
              if not (os.path.isfile(path) and os.path.getsize(path) > 0):
                  print(f"❌ missing thumbnail ({safe_ref(thumbnail)})")
          EOF
            echo "Upload the image(s) above to your image bucket, then rerun this workflow to rebuild."
          fi

      # Last on purpose. $GITHUB_STEP_SUMMARY renders blocks in the order steps append them, so
      # the page reads: the Final QA table (from verify_final.py), then this — the one thing a
      # finished run still needs a human for, fenced for copy-paste into YouTube's subtitle box.
      # ~33 KB against the 1 MiB per-step cap. The transcript *file* is written much earlier, by
      # transcript.py, so it survives a failure in between; `if: always()` publishes it even when
      # the video or the upload failed (a job cancelled by timeout skips this, but such a run has
      # no video to subtitle either).
      - name: Publish the transcript to the summary
        if: always()
        working-directory: sec10v
        env:
          FALLBACK_STATUS: ${{ steps.fallback.outputs.status }}
        run: |
          if [ "$FALLBACK_STATUS" = "uploaded" ]; then
            echo "✅ video already uploaded — no new transcript to subtitle"
            exit 0
          fi
          transcript="out/${BASE}.transcript.txt"
          if [ -s "$transcript" ]; then
            {
              echo
              echo "### Transcript (upload as the subtitle track)"
              echo
              printf '```text\n'; cat "$transcript"; printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "transcript written to the run summary ($(wc -c < "$transcript") bytes)"
          else
            echo "⚠️ no $transcript to publish"
          fi
