# Main-runner workflow for nqminhuit/friendly-broccoli — copy to .github/workflows/sec10v_chapter.yml there.
#
# One manual dispatch turns a Standard Ebooks chapter URL into a finished MP4. The only human
# step is drawing the background image, and it is deliberately moved to the front:
#
#   prepare_chapter.py → opencode writes the image prompt + SEO → THE PROMPT IS PRINTED IN THE
#   RUN SUMMARY → trigger_workflow.py fans out N chunk runs + 1 intro run of sec10v.yml →
#   import_artifacts_mp3s.py collects them (retrying stragglers) → audio artifact uploaded →
#   fetch_image.py waits for <IMAGE_BASE_URL>/<BaseName>.jpg → automate_audiobook.py builds
#   the video → second artifact with the MP4.
#
# So: dispatch, open the run page, copy the prompt from the summary, generate the image, upload
# it to the bucket under the BaseName. That happens while the TTS runs, so it costs no wall clock.
#
# Secrets needed — Settings → Secrets and variables → Actions → Secrets:
#   IMAGE_BASE_URL       prefix you upload images to, no trailing slash. GET
#                        <IMAGE_BASE_URL>/<BaseName>.jpg must work with plain unauthenticated
#                        curl, but the prefix itself stays out of this public repo's logs:
#                        GitHub masks secrets, so it prints as *** in the log and the summary.
#                        That is why the summary tells you the FILENAME to upload rather than
#                        the whole URL — the prefix is yours to remember.
#   SEC10V_ACCESS_TOKEN  also used by sec10v.yml
#   OPENCODE_API_KEY     https://opencode.ai/zen — required even for the free models
#   HF_TOKEN
name: sec10v chapter
run-name: ${{ inputs.se_url }}

on:
  workflow_dispatch:
    inputs:
      se_url:
        description: 'Standard Ebooks chapter URL, copied from GitHub (…/standardebooks/<repo>/blob/master/src/epub/text/<chapter>.xhtml)'
        required: true
        type: string
      # Everything else is inferred by prepare_chapter.py from that one URL:
      #   repo + chapter ← parsed out of the URL
      #   BaseName       ← repo + chapter slugs      (TheWisdomOfFatherBrown.TheManInThePassage)
      #   book title     ← <dc:title> in the book's content.opf
      #   chapter title  ← the chapter's <h2 epub:type="title"> heading
      image_url:
        description: 'Direct URL of an already-generated image (skips the wait — for a re-run)'
        required: false
        type: string
        default: ''
      model:
        description: 'opencode model id (provider/model); OpenCode Zen ids look like opencode/<slug>'
        required: false
        type: string
        default: 'opencode/mimo-v2.5-free'
      sec10v_ref:
        description: 'nqminhuit/sec10v ref to check out'
        required: false
        type: string
        default: 'master'

# Not dispatch inputs — every chapter so far has used the same values, and a field you always
# leave alone is a field you can get wrong. Change them here if that stops being true.
env:
  IMAGE_EARLY_WAIT_MINUTES: '20' # while the chunk runs are synthesizing — free, that time is
                                 # otherwise spent idle in the collector's poll
  IMAGE_WAIT_MINUTES: '60'      # second chance, after the audio is collected; 0 disables the video
  INTRO_AUDIO: intro.7s.mp3     # in sec10v resources/music/, skipped if it isn't there
  OUTRO_AUDIO: sad_allegro.mp3  # idem

permissions:
  actions: write        # dispatch sec10v.yml runs in this repo and read their artifacts
  contents: write       # required by anomalyco/opencode/github with use_github_token: true
  issues: write         # (idem — the action's documented minimum; nothing here opens issues/PRs)
  pull-requests: write  # (idem)

jobs:
  prepare:
    runs-on: ubuntu-latest
    # 3 TTS rounds (40 min each) + the image wait (60) + prepare/opencode/HF warm/encode/upload.
    # GitHub's ceiling for a hosted job is 360.
    timeout-minutes: 330
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false   # as in the opencode action's reference workflow

      - name: Checkout nqminhuit/sec10v
        uses: actions/checkout@v7
        with:
          repository: nqminhuit/sec10v
          path: sec10v
          ref: ${{ inputs.sec10v_ref }}
          token: ${{ secrets.SEC10V_ACCESS_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The main runner never runs TTS itself; requests is all the sec10v scripts here import.
      # (automate_audiobook.py is stdlib-only and skips TTS entirely when the MP3s exist.)
      - name: Install Python dependencies
        run: pip install requests

      - name: Prepare chapter text, chunks, intro and dispatch manifest
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          SE_URL: ${{ inputs.se_url }}   # via env, never spliced into the script body
        run: |
          python scripts/prepare_chapter.py --url "$SE_URL"
          # Export the parsed/inferred values for the later steps.
          python - <<'EOF' >> "$GITHUB_ENV"
          import json
          d = json.load(open("out/chapter.json"))
          for env, key in (("BASE", "base_name"), ("BOOK_TITLE", "book_title"),
                           ("CHAPTER_TITLE", "chapter_title"),
                           ("SE_REPO", "repo")):
              assert "\n" not in d[key]
              print(f"{env}={d[key]}")
          EOF
          echo "--- out/text ---"; ls -la out/text
          echo "--- dispatch manifest ---"; python -c "import json; print(len(json.load(open('out/workflow-input.json'))), 'item(s)')"

      # YouTube takes an untimed transcript and aligns it to the audio itself, so this is just
      # the intro plus the chapter text — the exact words the TTS read. Written here, right after
      # the text exists, so it survives a failure anywhere later in the run.
      - name: Write the YouTube transcript
        working-directory: sec10v
        run: |
          echo "::group::transcript"
          python scripts/transcript.py
          echo "::endgroup::"

      # A run that died after the audio (no image, a broken encode, a timeout) left its MP3s in
      # an artifact named after the BaseName. Fetch them instead of spending another 40 minutes
      # of runners recreating them. Opportunistic: no artifact, an expired one or a network
      # failure all just mean "synthesize from scratch".
      - name: Reuse audio from a previous run of this chapter
        continue-on-error: true
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/reuse_audio.py \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --token "${{ secrets.GITHUB_TOKEN }}"

      # With whatever was reused now on disk, this rewrites the manifest down to the chunks that
      # are genuinely missing, and reports what the rest of the run still has to do.
      - name: Decide what still needs doing
        id: tts
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
        run: |
          set +e
          python scripts/pending_chunks.py --rewrite
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "needs_tts=false" >> "$GITHUB_OUTPUT"
              echo "✅ every chunk's audio is already here — skipping the weights cache, the"
              echo "   dispatch and the collection, straight to the image and the video"
              ;;
            10) echo "needs_tts=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

          # The prompt and the SEO come out of the chapter text, so a recovered pair is as good
          # as a freshly generated one — and skipping opencode skips an LLM call entirely.
          if [ -s "out/prompts/${BASE}.prompt.txt" ] && [ -s "out/seo/${BASE}.seo.md" ]; then
            echo "creative=true" >> "$GITHUB_OUTPUT"
            echo "✅ image prompt and SEO recovered from a previous run — no opencode call needed"
          else
            echo "creative=false" >> "$GITHUB_OUTPUT"
          fi

      # The only LLM step, via the official action (https://opencode.ai/docs/github/), and it runs
      # FIRST so the image prompt is on screen a few minutes into the run — the human then draws
      # while the TTS below is still going. workflow_dispatch requires an explicit `prompt`;
      # `use_github_token: true` skips the OpenCode GitHub App / OIDC setup. The action runs in the
      # workspace root, so every path in the prompt is prefixed with sec10v/. opencode.json limits
      # it to file edits (no shell). Its failure never blocks the run — the image flow depends only
      # on the URL convention, not on the prompt.
      - name: Restrict opencode to file edits
        run: |
          # The action commits whatever it wrote. persist-credentials: false means that commit
          # goes nowhere and dies with the runner, but without an identity it fails outright and
          # reports the whole step as failed even when both files were written correctly.
          git config user.email "actions@github.com"
          git config user.name "sec10v chapter runner"
          mkdir -p sec10v/out/prompts sec10v/out/seo
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": { "edit": "allow", "bash": "deny" }
          }
          EOF

      - name: Generate image prompt and SEO with opencode
        id: creative
        if: steps.tts.outputs.creative != 'true'
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ inputs.model }}
          use_github_token: true
          share: false
          prompt: |
            You are working in a checkout of the sec10v repository located at ./sec10v.
            Do exactly two tasks and nothing else.

            Chapter text: sec10v/out/text/${{ env.BASE }}.txt
            Book title: ${{ env.BOOK_TITLE }}
            Chapter title: ${{ env.CHAPTER_TITLE }}
            Author: see the <dc:creator> of the book (Standard Ebooks repo ${{ env.SE_REPO }})
            BaseName: ${{ env.BASE }}

            Task 1 — follow sec10v/.github/skills/image-prompt-generator/SKILL.md exactly
            (single-file mode) and write the prompt to
            sec10v/out/prompts/${{ env.BASE }}.prompt.txt.

            Task 2 — follow sec10v/.github/skills/audiobook-youtube-seo/SKILL.md exactly and
            write the result to sec10v/out/seo/${{ env.BASE }}.seo.md. Match the
            structure of any existing files in sec10v/out/seo/.

            Do not modify any other file. Do not run shell commands. Do not commit or push.

      - name: Check opencode outputs
        id: creative_check
        if: steps.tts.outputs.creative != 'true'
        continue-on-error: true
        working-directory: sec10v
        run: |
          for f in "out/prompts/${BASE}.prompt.txt" "out/seo/${BASE}.seo.md"; do
            if [ ! -s "$f" ]; then echo "❌ opencode did not produce $f"; exit 1; fi
            echo "=== $f ==="; cat "$f"; echo
          done

      # $GITHUB_STEP_SUMMARY renders at the top of the run page, so the prompt and the upload
      # target are readable without expanding a single step. `if: always()` because a failed
      # opencode is exactly when you most need the fallback instructions.
      # Every conditional here is if/fi, never `[ … ] && …`: under `bash -e` a trailing false
      # test would fail the step, and a failed always()-step marks the whole job failed.
      - name: Publish the image prompt
        # Pointless when the caller already has an image — there is nothing left to draw.
        if: always() && inputs.image_url == ''
        working-directory: sec10v
        env:
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: |
          prompt="out/prompts/${BASE}.prompt.txt"
          # IMAGE_BASE_URL is a secret, so anything echoing it shows as ***; the filename is
          # the part you actually need, and it is not sensitive.
          if [ -n "$IMAGE_BASE_URL" ]; then target="your image bucket"; else target="your image bucket (set the IMAGE_BASE_URL secret)"; fi
          {
            echo "## Image prompt — ${BOOK_TITLE} / ${CHAPTER_TITLE}"
            echo
            if [ -s "$prompt" ]; then
              printf '```text\n'; cat "$prompt"; printf '\n```\n'
            else
              echo "> opencode produced no prompt — write one from"
              echo "> \`.github/skills/image-prompt-generator/SKILL.md\`. Chapter opening:"
              printf '```text\n'; head -c 1200 "out/text/${BASE}.txt"; printf '\n```\n'
            fi
            echo
            echo "The YouTube transcript is in the artifact as \`${BASE}.transcript.txt\`."
            echo
            echo "### Upload the generated image to ${target} as"
            echo
            printf '```\n%s.jpg\n```\n' "$BASE"
            echo
            echo "\`.png\`, \`.jpeg\` and \`.webp\` work too (same base name). Polling starts as soon"
            echo "as the chunk runs are dispatched and lasts ${IMAGE_EARLY_WAIT_MINUTES} minute(s) — upload during that"
            echo "window and this run confirms it within seconds. A second window of"
            echo "${IMAGE_WAIT_MINUTES} minute(s) follows once the audio is collected."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$prompt" ]; then
            echo "::group::image prompt"; cat "$prompt"; echo; echo "::endgroup::"
          fi
          echo "upload the image as ${BASE}.jpg (prefix comes from the IMAGE_BASE_URL secret)"

      # Needed by the video build at the end (and it is cheap here, while the human is drawing).
      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n1
            exit 0
          fi
          # Must be a full apt-get update: Ubuntu 24.04 keeps its repositories in
          # /etc/apt/sources.list.d/ubuntu.sources (deb822), so a narrowed update refreshes no
          # index at all and apt resolves package versions from the image's stale one — those 404
          # once the mirror moves on (e.g. libssh-gcrypt-4 0.10.6-2ubuntu0.4).
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg \
            || sudo apt-get install -y --no-install-recommends --fix-missing ffmpeg
          ffmpeg -version | head -n1

      # One hub download per chapter instead of one per chunk: the chunk runs restore this
      # same cache key and then run with HF_HUB_OFFLINE=1. Without it they all hit Hugging
      # Face at the same moment and got HTTP 429. The key must stay identical to the one in
      # sec10v.yml — both hash the requirements file that pins chatterbox-tts.
      - name: Restore the Chatterbox weights cache
        id: hf_cache
        if: steps.tts.outputs.needs_tts == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-chatterbox-${{ hashFiles('sec10v/requirements_no_cuda.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-chatterbox-

      - name: Warm the Chatterbox weights cache
        if: steps.tts.outputs.needs_tts == 'true' && steps.hf_cache.outputs.cache-hit != 'true'
        working-directory: sec10v
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Two separate installs on purpose: --no-deps applies to every package in a pip
          # command, so installing both together left huggingface_hub without httpx and the
          # fetch died with ModuleNotFoundError. huggingface_hub needs its dependencies;
          # chatterbox-tts is code-only here, just so hf_weights.py can read the weight list
          # out of the version this chapter will actually run with.
          pip install --quiet huggingface_hub
          pin=$(grep -m1 '^chatterbox-tts==' requirements_no_cuda.txt)
          pip install --quiet --no-deps "${pin:-chatterbox-tts}"
          python scripts/hf_weights.py --no-stagger
          du -sh ~/.cache/huggingface

      - name: Save the Chatterbox weights cache
        if: steps.tts.outputs.needs_tts == 'true' && steps.hf_cache.outputs.cache-hit != 'true'
        continue-on-error: true   # a concurrent run may have reserved the same key already
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-chatterbox-${{ hashFiles('sec10v/requirements_no_cuda.txt') }}

      # Dispatch → wait → re-dispatch only what is missing. A chunk run can die on its own
      # (hub rate limit, flaky mirror, the QA retry giving up), and the runner has no
      # persistent out/ to resume from, so pending_chunks.py rebuilds the manifest from the
      # audio that actually landed: exit 0 = complete, 10 = it rewrote the manifest with the
      # stragglers, anything else = broken. A chunk that hasn't finished in 40 minutes never
      # will — re-dispatching it next round is faster than waiting, and 3 x 40 leaves room in
      # the job budget for the image wait and the encode.
      # trigger_workflow.py returns as soon as the runs are dispatched, so the chunks synthesize
      # on their own runners from here on. Round 1 is dispatched in its own step purely so the
      # image wait below can slot in between dispatch and collection.
      - name: Dispatch one sec10v.yml run per chunk (+ intro)
        if: steps.tts.outputs.needs_tts == 'true'
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/trigger_workflow.py \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --workflow sec10v.yml \
            --ref master \
            --inputs-file out/workflow-input.json \
            --token "${{ secrets.GITHUB_TOKEN }}"

      # Costs nothing: without it the job would spend these minutes idle inside the collector's
      # poll. The payoff is feedback while you can still act on it — the log streams live, so a
      # wrong filename or a corrupt upload shows up now instead of an hour from now.
      - name: Wait for the background image (while the chunks synthesize)
        id: image
        continue-on-error: true
        timeout-minutes: 60   # safety net only; fetch_image.py enforces its own deadline
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          wait_minutes=${IMAGE_EARLY_WAIT_MINUTES%%.*}
          if [ "${wait_minutes:-0}" -eq 0 ] || { [ -z "$IMAGE_URL" ] && [ -z "$IMAGE_BASE_URL" ]; }; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ skipping the early image wait"
            exit 0
          fi
          args=(--base-name "$BASE" --timeout "$((wait_minutes * 60))" --poll-interval 20)
          if [ -n "$IMAGE_URL" ]; then args+=(--url "$IMAGE_URL"); else args+=(--base-url "$IMAGE_BASE_URL"); fi
          set +e
          python scripts/fetch_image.py "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "✅ image received and converted — the video will build as soon as the audio lands"
            echo "### ✅ Image received" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏳ no image yet — there is a second window after the audio is collected"
          fi

      - name: Collect MP3s, retry stragglers
        if: steps.tts.outputs.needs_tts == 'true'
        working-directory: sec10v
        timeout-minutes: 200   # bounds the polling loop below; the job cap is 330
        env:
          PYTHONPATH: scripts
        run: |
          rounds=3
          for round in $(seq 1 "$rounds"); do
            if [ "$round" -gt 1 ]; then
              echo "::group::round $round — re-dispatch the missing chunk(s)"
              # trigger_workflow.py rewrites out/run_ids.json, so each round polls only its own runs.
              python scripts/trigger_workflow.py \
                --owner "${{ github.repository_owner }}" \
                --repo "${{ github.event.repository.name }}" \
                --workflow sec10v.yml \
                --ref master \
                --inputs-file out/workflow-input.json \
                --token "${{ secrets.GITHUB_TOKEN }}"
              echo "::endgroup::"
            fi

            # Round 1 dispatches 30+ runs, which queue behind GitHub's concurrency limit, so a
            # chunk can legitimately take ~45 min end to end. Later rounds have the runners to
            # themselves.
            if [ "$round" -eq 1 ]; then collect_timeout=5400; else collect_timeout=2700; fi

            while :; do
              echo "::group::round $round — wait and collect"
              python scripts/import_artifacts_mp3s.py \
                --download --move \
                --poll-interval 60 --timeout "$collect_timeout" \
                --token "${{ secrets.GITHUB_TOKEN }}"
              echo "::endgroup::"

              set +e
              python scripts/pending_chunks.py --rewrite
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                echo "✅ every chunk present after round $round"
                break 2
              fi
              if [ "$rc" -ne 10 ]; then exit "$rc"; fi

              # Audio is missing — but only re-dispatch runs that have actually finished.
              # Re-dispatching one that is merely slow duplicates ~40 minutes of TTS and makes
              # the wait *longer*: chunk 27 once ran 04:26-05:12 while the loop gave up at
              # 05:06 and started a copy at 05:08.
              if python scripts/runs_alive.py --token "${{ secrets.GITHUB_TOKEN }}"; then
                echo "⏳ chunk run(s) still in flight — polling again instead of re-dispatching"
                continue
              fi
              break
            done

            if [ "$round" -eq "$rounds" ]; then
              echo "❌ still missing chunk(s) after $rounds round(s)"
              exit 1
            fi
            echo "🔁 round $((round + 1)) will re-dispatch only the missing chunk(s)"
          done
          echo "--- out/*.mp3 ---"; ls -la out/*.mp3

      # Uploaded BEFORE the image wait on purpose: a job cancelled by timeout-minutes skips even
      # `if: always()` steps, and the audio is the expensive half of the run.
      #
      # success() || failure() rather than always(): on a *cancelled* run this step would upload
      # whatever happened to be in out/ under the chapter's name, and a near-empty artifact then
      # sits in front of the complete one that reuse_audio.py wants. Cancelling early left
      # exactly that — 0.1 MB of text and prompt masking a 91 MB artifact.
      - name: Upload chapter artifact (text, mp3s, prompt, seo)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BASE || github.run_id }}
          path: |
            sec10v/out/text/
            sec10v/out/*.transcript.txt
            sec10v/out/*.mp3
            sec10v/out/prompts/
            sec10v/out/seo/
            sec10v/out/chapter.json
            sec10v/out/run_ids.json
          if-no-files-found: error
          retention-days: 7

      # Second chance, for when the image wasn't up yet during the synthesis window. fetch_image.py
      # short-circuits on an existing out/pics/{base}.jpg, but skipping the step is cheaper still.
      - name: Wait for the background image (second chance)
        id: image_retry
        if: steps.image.outputs.found != 'true'
        continue-on-error: true
        timeout-minutes: 180   # safety net only: fetch_image.py enforces --timeout itself
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          IMAGE_URL: ${{ inputs.image_url }}   # via env: a dispatch input must never be spliced into the script
        run: |
          wait_minutes=${IMAGE_WAIT_MINUTES%%.*}
          if [ "${wait_minutes:-0}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ image wait disabled (IMAGE_WAIT_MINUTES=0)"
            exit 0
          fi
          if [ -z "$IMAGE_URL" ] && [ -z "$IMAGE_BASE_URL" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ no IMAGE_BASE_URL secret and no image_url input — skipping the video"
            exit 0
          fi
          args=(--base-name "$BASE" --timeout "$((wait_minutes * 60))" --poll-interval 20)
          if [ -n "$IMAGE_URL" ]; then
            args+=(--url "$IMAGE_URL")
          else
            args+=(--base-url "$IMAGE_BASE_URL")
          fi
          set +e
          python scripts/fetch_image.py "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            ls -la out/pics
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ no usable image (exit $rc) — the audio artifact is already uploaded;"
            echo "   re-run with image_url set to build the video without redoing the TTS."
          fi

      - name: Build the final video
        if: steps.image.outputs.found == 'true' || steps.image_retry.outputs.found == 'true'
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
          PYTHONUNBUFFERED: '1'   # so the per-segment progress lines stream instead of arriving at the end
        run: |
          # Preflight: every mp3 must exist, or automate_audiobook would shell out to audiobook.py
          # and fail on the torch this runner deliberately doesn't have.
          python scripts/pending_chunks.py
          args=("$BASE")
          # validate_inputs() hard-fails on a music file that isn't there, so check rather than
          # lose the whole video to a renamed asset — automate_audiobook simply omits the segment.
          if [ -n "$INTRO_AUDIO" ] && [ -f "resources/music/$INTRO_AUDIO" ]; then
            args+=(--intro-audio "$INTRO_AUDIO")
          else
            echo "⚠️ resources/music/$INTRO_AUDIO missing — intro will have no music bed"
          fi
          if [ -n "$OUTRO_AUDIO" ] && [ -f "resources/music/$OUTRO_AUDIO" ]; then
            args+=(--outro-audio "$OUTRO_AUDIO")
          else
            echo "⚠️ resources/music/$OUTRO_AUDIO missing — no outro segment"
          fi
          python scripts/automate_audiobook.py "${args[@]}"
          ls -lh out/*.final.mp4

      # Only the final: the numbered out/{base}.{i}.mp4 segments are ~90 MB of rebuildable
      # intermediates.
      - name: Upload the final video
        if: success() || failure()   # never from a cancelled run — see the audio upload above
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BASE || github.run_id }}.video
          path: sec10v/out/*.final.mp4
          if-no-files-found: warn
          retention-days: 7

      # Fail loudly *after* both uploads so partial output is always available.
      - name: Report chunk, prompt and video status
        working-directory: sec10v
        run: |
          if [ -f out/run_ids.json ]; then
            remaining=$(python -c "import json; d=json.load(open('out/run_ids.json')); print(len(d)); [print(' -', e['out_subdir'], e['run_id']) for e in d]")
          else
            remaining=0   # no chunk run was dispatched at all (audio came from a previous run)
          fi
          if [ "$(echo "$remaining" | head -n1)" != "0" ]; then
            echo "❌ chunk run(s) still pending/failed:"; echo "$remaining" | tail -n +2
            echo "These runs failed in the last retry round; rerun this workflow to try again."
            exit 1
          fi
          # creative_check is the honest signal: it tests the two files. The action itself can
          # report failure for reasons that don't matter here (a failed internal git commit, or
          # its title side-model being rejected by the billing check).
          if [ "${{ steps.creative_check.outcome }}" != "success" ]; then
            echo "⚠️ opencode did not produce the prompt/SEO — write them manually from the skills; MP3s are complete."
          fi
          if [ "${{ steps.image.outputs.found }}" != "true" ] && [ "${{ steps.image_retry.outputs.found }}" != "true" ]; then
            echo "⚠️ no background image arrived — audio artifact only."
            echo "   Re-run with image_url set (or upload to the conventional path) to get the MP4."
          fi
