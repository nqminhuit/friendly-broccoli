name: omnivoice
run-name: ${{ inputs.output_name }}

on:
  push:
    paths:
      - 'text/omnivoice.txt'
  workflow_dispatch:
    inputs:
      tts_text:
        description: 'Text to synthesize'
        required: true
        type: string
      audio_rate:
        description: 'Audio playback rate (0.9 = 10% slower, 1.0 = normal)'
        required: false
        type: string
        default: '1.0'
      output_name:
        description: 'Output filename (without extension)'
        required: true
        type: string
      ref_base:
        description: 'Reference base path (without extension) relative to sec10v'
        required: false
        type: string
        default: 'resources/voices/_live/DianeAlailima_wondergarden_122_olcott_128kb.cleaned'

permissions:
  contents: read
  
env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  
jobs:
  build-external:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y -o Dir::Etc::sourcelist="sources.list" \
              -o Dir::Etc::sourceparts="-" \
              -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Checkout external repository
        uses: actions/checkout@v7
        with:
          repository: nqminhuit/sec10v
          path: sec10v
          ref: master
          token: ${{ secrets.SEC10V_ACCESS_TOKEN }}
          fetch-depth: 1

      # Move to the external repo directory and build

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Cache Python venv
        id: cache-venv
        uses: actions/cache@v6
        with:
          path: sec10v/.venv
          key: ${{ runner.os }}-venv-py3.13-${{ hashFiles('sec10v/requirements-omnivoice.txt') }}-torch-cpu

      - name: Install Python dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        working-directory: sec10v
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements-omnivoice.txt

      - name: Activate Python venv
        run: echo "${{ github.workspace }}/sec10v/.venv/bin" >> $GITHUB_PATH

      - name: Create output directory
        working-directory: sec10v
        run: mkdir -p out

      - name: Run TTS generation
        id: tts1
        working-directory: sec10v
        run: |
          # Resolve ref audio/text from inputs or defaults
          REF_BASE="${{ github.event.inputs.ref_base }}"
          REF_BASE="${REF_BASE:-resources/voices/_live/DianeAlailima_wondergarden_122_olcott_128kb.cleaned}"
          REF_AUDIO="$REF_BASE.mp3"
          REF_TEXT_FILE="$REF_BASE.txt"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python scripts/audiobook_omnivoice.py \
              --tts "${{ github.event.inputs.tts_text }}" \
              --ref-audio "$REF_AUDIO" \
              --ref-text-file "$REF_TEXT_FILE" \
              --language "vi" \
              --audio-format mp3
          else
            python scripts/audiobook_omnivoice.py \
              --tts-file "$GITHUB_WORKSPACE/text/omnivoice.txt" \
              --ref-audio "$REF_AUDIO" \
              --ref-text-file "$REF_TEXT_FILE" \
              --language "vi" \
              --audio-format mp3
          fi

          if [ -f "out/audiobook.mp3" ]; then
            echo "✅ TTS audio file generated successfully"
          else
            echo "❌ Error: TTS audio file not found!"
            exit 1
          fi

      - name: Upload audio artifacts
        uses: actions/upload-artifact@v7
        with:
          path: sec10v/out/*.mp3
          if-no-files-found: error
          retention-days: 1
          archive: false
