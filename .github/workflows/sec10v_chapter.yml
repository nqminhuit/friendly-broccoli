# Main-runner workflow for nqminhuit/friendly-broccoli — copy to .github/workflows/sec10v_chapter.yml there.
#
# One manual dispatch prepares a Standard Ebooks chapter end-to-end except for the image:
#   prepare_chapter.py → trigger_workflow.py (fans out N chunk runs + 1 intro run of sec10v.yml)
#   → import_artifacts_mp3s.py (waits, collects) → anomalyco/opencode/github action writes
#   prompt + SEO → one artifact.
# Locally you then unzip the artifact into out/, add out/pics/{base}.jpg, and run
# automate_audiobook.py — ffmpeg only, no torch, because every .mp3 (incl. .intro.mp3) exists.
#
# Secrets needed in friendly-broccoli: SEC10V_ACCESS_TOKEN (already used by sec10v.yml) and
# OPENCODE_API_KEY (from https://opencode.ai/zen — required even for the free models).
name: sec10v chapter
run-name: ${{ inputs.se_url }}

on:
  workflow_dispatch:
    inputs:
      se_url:
        description: 'Standard Ebooks chapter URL, copied from GitHub (…/standardebooks/<repo>/blob/master/src/epub/text/<chapter>.xhtml)'
        required: true
        type: string
      # Everything else is inferred by prepare_chapter.py from that one URL:
      #   repo + chapter ← parsed out of the URL
      #   BaseName       ← repo + chapter slugs      (TheWisdomOfFatherBrown.TheManInThePassage)
      #   book title     ← <dc:title> in the book's content.opf
      #   chapter title  ← the chapter's <h2 epub:type="title"> heading
      model:
        description: 'opencode model id (provider/model); OpenCode Zen ids look like opencode/<slug>'
        required: false
        type: string
        default: 'opencode/mimo-v2.5-free'
      sec10v_ref:
        description: 'nqminhuit/sec10v ref to check out'
        required: false
        type: string
        default: 'master'

permissions:
  actions: write        # dispatch sec10v.yml runs in this repo and read their artifacts
  contents: write       # required by anomalyco/opencode/github with use_github_token: true
  issues: write         # (idem — the action's documented minimum; nothing here opens issues/PRs)
  pull-requests: write  # (idem)

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false   # as in the opencode action's reference workflow

      - name: Checkout nqminhuit/sec10v
        uses: actions/checkout@v7
        with:
          repository: nqminhuit/sec10v
          path: sec10v
          ref: ${{ inputs.sec10v_ref }}
          token: ${{ secrets.SEC10V_ACCESS_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The main runner never runs TTS itself; requests is all the sec10v scripts here import.
      - name: Install Python dependencies
        run: pip install requests

      - name: Prepare chapter text, chunks, intro and dispatch manifest
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/prepare_chapter.py --url "${{ inputs.se_url }}"
          # Export the parsed/inferred values for the later steps.
          python - <<'EOF' >> "$GITHUB_ENV"
          import json
          d = json.load(open("out/chapter.json"))
          for env, key in (("BASE", "base_name"), ("BOOK_TITLE", "book_title"),
                           ("CHAPTER_TITLE", "chapter_title"),
                           ("SE_REPO", "repo")):
              assert "\n" not in d[key]
              print(f"{env}={d[key]}")
          EOF
          echo "--- out/text ---"; ls -la out/text
          echo "--- dispatch manifest ---"; python -c "import json; print(len(json.load(open('out/workflow-input.json'))), 'item(s)')"

      # One hub download per chapter instead of one per chunk: the chunk runs restore this
      # same cache key and then run with HF_HUB_OFFLINE=1. Without it they all hit Hugging
      # Face at the same moment and got HTTP 429. The key must stay identical to the one in
      # sec10v.yml — both hash the requirements file that pins chatterbox-tts.
      - name: Restore the Chatterbox weights cache
        id: hf_cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-chatterbox-${{ hashFiles('sec10v/requirements_no_cuda.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-chatterbox-

      - name: Warm the Chatterbox weights cache
        if: steps.hf_cache.outputs.cache-hit != 'true'
        working-directory: sec10v
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # chatterbox-tts is installed without its dependencies purely so hf_weights.py can
          # read the weight list out of the version this chapter will actually run with.
          pin=$(grep -m1 '^chatterbox-tts==' requirements_no_cuda.txt)
          pip install --quiet huggingface_hub "${pin:-chatterbox-tts}" --no-deps
          python scripts/hf_weights.py --no-stagger
          du -sh ~/.cache/huggingface

      - name: Save the Chatterbox weights cache
        if: steps.hf_cache.outputs.cache-hit != 'true'
        continue-on-error: true   # a concurrent run may have reserved the same key already
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-chatterbox-${{ hashFiles('sec10v/requirements_no_cuda.txt') }}

      # Dispatch → wait → re-dispatch only what is missing. A chunk run can die on its own
      # (hub rate limit, flaky mirror, the QA retry giving up), and the runner has no
      # persistent out/ to resume from, so pending_chunks.py rebuilds the manifest from the
      # audio that actually landed: exit 0 = complete, 10 = it rewrote the manifest with the
      # stragglers, anything else = broken. Three rounds at 60 min fit the job timeout.
      - name: Dispatch chunk runs, collect MP3s, retry stragglers
        working-directory: sec10v
        env:
          PYTHONPATH: scripts
        run: |
          rounds=3
          for round in $(seq 1 "$rounds"); do
            echo "::group::round $round — dispatch"
            # trigger_workflow.py rewrites out/run_ids.json, so each round polls only its own runs.
            python scripts/trigger_workflow.py \
              --owner "${{ github.repository_owner }}" \
              --repo "${{ github.event.repository.name }}" \
              --workflow sec10v.yml \
              --ref master \
              --inputs-file out/workflow-input.json \
              --token "${{ secrets.GITHUB_TOKEN }}"
            echo "::endgroup::"

            echo "::group::round $round — wait and collect"
            python scripts/import_artifacts_mp3s.py \
              --download --move \
              --poll-interval 60 --timeout 3600 \
              --token "${{ secrets.GITHUB_TOKEN }}"
            echo "::endgroup::"

            set +e
            python scripts/pending_chunks.py --rewrite
            rc=$?
            set -e
            case "$rc" in
              0)
                echo "✅ every chunk present after round $round"
                break
                ;;
              10)
                if [ "$round" -eq "$rounds" ]; then
                  echo "❌ still missing chunk(s) after $rounds round(s)"
                  exit 1
                fi
                echo "🔁 round $((round + 1)) will re-dispatch only the missing chunk(s)"
                ;;
              *)
                exit "$rc"
                ;;
            esac
          done
          echo "--- out/*.mp3 ---"; ls -la out/*.mp3

      # The only LLM step, via the official action (https://opencode.ai/docs/github/).
      # workflow_dispatch requires an explicit `prompt`; `use_github_token: true` skips the
      # OpenCode GitHub App / OIDC setup. The action runs in the workspace root, so every path
      # in the prompt is prefixed with sec10v/. opencode.json limits it to file edits (no shell).
      # Its failure never blocks the artifact — the MP3s are the expensive part.
      - name: Restrict opencode to file edits
        run: |
          mkdir -p sec10v/out/prompts sec10v/out/seo
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": { "edit": "allow", "bash": "deny" }
          }
          EOF

      - name: Generate image prompt and SEO with opencode
        id: creative
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ inputs.model }}
          use_github_token: true
          share: false
          prompt: |
            You are working in a checkout of the sec10v repository located at ./sec10v.
            Do exactly two tasks and nothing else.

            Chapter text: sec10v/out/text/${{ env.BASE }}.txt
            Book title: ${{ env.BOOK_TITLE }}
            Chapter title: ${{ env.CHAPTER_TITLE }}
            Author: see the <dc:creator> of the book (Standard Ebooks repo ${{ env.SE_REPO }})
            BaseName: ${{ env.BASE }}

            Task 1 — follow sec10v/.github/skills/image-prompt-generator/SKILL.md exactly
            (single-file mode) and write the prompt to
            sec10v/out/prompts/${{ env.BASE }}.prompt.txt.

            Task 2 — follow sec10v/.github/skills/audiobook-youtube-seo/SKILL.md exactly and
            write the result to sec10v/out/seo/${{ env.BASE }}.seo.md. Match the
            structure of any existing files in sec10v/out/seo/.

            Do not modify any other file. Do not run shell commands. Do not commit or push.

      - name: Check opencode outputs
        id: creative_check
        continue-on-error: true
        working-directory: sec10v
        run: |
          for f in "out/prompts/${BASE}.prompt.txt" "out/seo/${BASE}.seo.md"; do
            if [ ! -s "$f" ]; then echo "❌ opencode did not produce $f"; exit 1; fi
            echo "=== $f ==="; cat "$f"; echo
          done

      - name: Upload chapter artifact (text, mp3s, prompt, seo)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BASE || github.run_id }}
          path: |
            sec10v/out/text/
            sec10v/out/*.mp3
            sec10v/out/prompts/
            sec10v/out/seo/
            sec10v/out/chapter.json
            sec10v/out/run_ids.json
          if-no-files-found: error
          retention-days: 7

      # Fail loudly *after* the upload so partial output is still available for a manual retry.
      - name: Fail if any chunk run did not succeed
        working-directory: sec10v
        run: |
          remaining=$(python -c "import json; d=json.load(open('out/run_ids.json')); print(len(d)); [print(' -', e['out_subdir'], e['run_id']) for e in d]")
          if [ "$(echo "$remaining" | head -n1)" != "0" ]; then
            echo "❌ chunk run(s) still pending/failed:"; echo "$remaining" | tail -n +2
            echo "These runs failed in the last retry round; rerun this workflow to try again."
            exit 1
          fi
          if [ "${{ steps.creative.outcome }}" != "success" ] || [ "${{ steps.creative_check.outcome }}" != "success" ]; then
            echo "⚠️ opencode did not produce the prompt/SEO — write them manually from the skills; MP3s are complete."
          fi
