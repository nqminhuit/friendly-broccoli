name: sec10v
run-name: ${{ inputs.output_name }}

on:
  workflow_dispatch:
    inputs:
      tts_text:
        description: 'Text to synthesize'
        required: true
        type: string
      audio_rate:
        description: 'Audio playback rate (0.9 = 10% slower, 1.0 = normal)'
        required: false
        type: string
        default: '1.0'
      output_name:
        description: 'Output filename (without extension)'
        required: true
        type: string

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  build-external:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n1
            exit 0
          fi
          # Must be a full apt-get update: Ubuntu 24.04 keeps its repositories in
          # /etc/apt/sources.list.d/ubuntu.sources (deb822), so the old
          # -o Dir::Etc::sourceparts="-" form refreshed no index at all and apt resolved
          # package versions from the image's stale one — those 404 once the mirror moves on
          # (e.g. libssh-gcrypt-4 0.10.6-2ubuntu0.4).
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg \
            || sudo apt-get install -y --no-install-recommends --fix-missing ffmpeg
          ffmpeg -version | head -n1

      - name: Checkout external repository
        uses: actions/checkout@v7
        with:
          repository: nqminhuit/sec10v
          path: sec10v
          ref: master
          token: ${{ secrets.SEC10V_ACCESS_TOKEN }}
          fetch-depth: 1

      - name: Checkout ggml-org/whisper.cpp
        uses: actions/checkout@v7
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: master
          fetch-depth: 1

      - name: Get whisper.cpp HEAD SHA
        id: whisper-sha
        run: echo "sha=$(git -C whisper.cpp rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache whisper.cpp build
        id: cache-whisper
        uses: actions/cache@v6
        with:
          path: |
            whisper.cpp/build
            whisper.cpp/models/ggml-small.en.bin
          key: ${{ runner.os }}-whisper-cpp-${{ steps.whisper-sha.outputs.sha }}-cpu-compat

      - name: Build whisper.cpp
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        working-directory: whisper.cpp
        run: |
            sh ./models/download-ggml-model.sh small.en
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
            cmake --build build -j --config Release
            ./build/bin/whisper-cli --help

      # Move to the external repo directory and build
      - name: Build 
        working-directory: sec10v
        run: |
          echo "Files in external-repo:"
          ls -la

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Cache Python venv
        id: cache-venv
        uses: actions/cache@v6
        with:
          path: sec10v/.venv
          key: ${{ runner.os }}-venv-py3.13-${{ hashFiles('sec10v/requirements_no_cuda.txt') }}-torch-cpu

      - name: Install Python dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        working-directory: sec10v
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements_no_cuda.txt

      - name: Activate Python venv
        run: echo "${{ github.workspace }}/sec10v/.venv/bin" >> $GITHUB_PATH

      # Chatterbox pulls its weights from the Hugging Face hub. One run per chunk meant a
      # 30-chunk chapter sent 30 cold clients after the same files at once, and the hub
      # answered HTTP 429. The main runner (sec10v_chapter.yml) warms this exact cache key
      # before it dispatches, so the chunk runs normally never call the hub at all.
      #
      # Keyed on requirements_no_cuda.txt, where the chatterbox-tts pin lives: bumping the
      # version invalidates the weights cache the same way it invalidates the venv cache.
      # restore-keys then seeds the new key from the previous weights, so an upgrade
      # downloads only what actually changed instead of the whole ~3 GB.
      - name: Cache Chatterbox weights (Hugging Face hub)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-chatterbox-${{ hashFiles('sec10v/requirements_no_cuda.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-chatterbox-

      - name: Ensure Chatterbox weights are local
        working-directory: sec10v
        run: |
          # hf_weights.py reads the file list out of the *installed* chatterbox, so a version
          # that renames or adds a weight file is handled here instead of failing offline.
          set +e
          .venv/bin/python scripts/hf_weights.py
          rc=$?
          set -e
          case "$rc" in
            0) echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV" ;;  # nothing left to ask the hub
            3) echo "⚠️ weight list not derived from the installed chatterbox — staying online" ;;
            *) exit "$rc" ;;
          esac

      - name: Verify voice prompt exists
        working-directory: sec10v
        run: |
          if [ ! -f "resources/voices/_live/maddpren_enhanced_cut_magician_12_maugham_128kb.wav" ]; then
            echo "❌ Error: Voice prompt file not found!"
            exit 1
          fi
          echo "✅ Voice prompt file found"

      - name: Create output directory
        working-directory: sec10v
        run: mkdir -p out

      - name: Run TTS generation (attempt 1)
        id: tts1
        working-directory: sec10v
        run: |
          python scripts/audiobook.py \
            --tts "${{ github.event.inputs.tts_text }}" \
            --audio-rate "${{ github.event.inputs.audio_rate }}"
          if [ -f "out/audiobook.mp3" ]; then
            echo "✅ TTS audio file generated successfully"
            ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 out/audiobook.mp3
          else
            echo "❌ Error: TTS audio file not found!"
            exit 1
          fi

      # Sliced, not one long pass: whisper silently drops whole sentences from a 2-minute
      # quote-dense chunk, which the Levenshtein gate then reads as a bad take. Measured on
      # TheDuelOfDrHirsch.09 with this same model: 67.63% FAIL in one pass, 94.96% PASS sliced.
      - name: Transcribe with Whisper in slices (attempt 1)
        id: whisper1
        working-directory: sec10v
        run: |
            python scripts/transcribe_sliced.py \
                --audio out/audiobook.mp3 \
                --whisper-cli ${{ github.workspace }}/whisper.cpp/build/bin/whisper-cli \
                --model ${{ github.workspace }}/whisper.cpp/models/ggml-small.en.bin \
                --out audiobook.gen.txt
            cat audiobook.gen.txt

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
            go-version: '1.24'
            cache: true

      - name: Verify TTS output (attempt 1)
        id: verify1
        working-directory: sec10v
        continue-on-error: true
        run: |
            echo "${{ github.event.inputs.tts_text }}" > expected_text.txt
            cat expected_text.txt
            if [ ! -f "audiobook.gen.txt" ]; then
                echo "❌ Transcription file missing"
                exit 1
            fi
            go run scripts/levenshtein.go expected_text.txt audiobook.gen.txt

      - name: Run TTS generation (retry)
        if: steps.verify1.outcome == 'failure'
        id: tts2
        working-directory: sec10v
        run: |
            echo "🔁 Retry triggered due to verification failure"
            python scripts/audiobook.py \
                --tts "${{ github.event.inputs.tts_text }}" \
                --audio-rate "${{ github.event.inputs.audio_rate }}"

            if [ ! -f "out/audiobook.mp3" ]; then
                echo "❌ Retry failed to generate audio"
                exit 1
            fi

      - name: Whisper transcription in slices (retry)
        if: steps.tts2.outcome == 'success'
        working-directory: sec10v
        run: |
            python scripts/transcribe_sliced.py \
                --audio out/audiobook.mp3 \
                --whisper-cli ${{ github.workspace }}/whisper.cpp/build/bin/whisper-cli \
                --model ${{ github.workspace }}/whisper.cpp/models/ggml-small.en.bin \
                --out audiobook.gen.txt
            cat audiobook.gen.txt

      - name: Verify TTS output (retry)
        if: steps.tts2.outcome == 'success'
        working-directory: sec10v
        run: |
            echo "${{ github.event.inputs.tts_text }}" > expected_text.txt
            if [ ! -f "audiobook.gen.txt" ]; then
                echo "❌ Transcription file missing"
                exit 1
            fi
            if go run scripts/levenshtein.go expected_text.txt audiobook.gen.txt; then
                echo "✅ Retry success"
            else
                echo "❌ Retry failed"
                exit 1
            fi

      - name: Rename output to custom name
        working-directory: sec10v
        run: |
          if [ -f "out/audiobook.mp3" ]; then
            mv out/audiobook.mp3 "out/${{ github.event.inputs.output_name }}.mp3"
            if [ -f "out/audiobook.srt" ]; then
              mv out/audiobook.srt "out/${{ github.event.inputs.output_name }}.srt"
            fi
          fi

      - name: List generated files
        working-directory: sec10v
        run: |
          echo "Generated files in out/:"
          ls -lah out/

      - name: Upload audio artifacts
        uses: actions/upload-artifact@v7
        with:
          path: sec10v/out/*.mp3
          if-no-files-found: error
          retention-days: 1
          archive: false

      - name: Show audio info
        working-directory: sec10v
        run: |
          for file in out/*.mp3; do
            if [ -f "$file" ]; then
              echo "=== Audio info for $file ==="
              ffprobe -v error -show_entries stream=codec_name,channels,sample_rate,bit_rate,duration -of default=noprint_wrappers=1 "$file"
            fi
          done
